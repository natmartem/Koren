<style>
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --ink:#161A2B; --mute:#5B6177; --line:#D5D9E6;
  --accent:#34468C; --accent-ink:#FFFFFF; --tint:#E0E5F4;
  --root:#A9580A; --root-tint:#F6E7D3; --good:#226B45; --good-tint:#DCEFE3; --soft:#F4F5FA;
  --f-body:'Onest','Noto Naskh Arabic',system-ui,sans-serif; --f-display:'Unbounded','Onest','Noto Naskh Arabic',system-ui,sans-serif;
  --f-ar:'Noto Naskh Arabic','Onest',serif; color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#11131C; --surface:#191C29; --ink:#E7E9F2; --mute:#9CA2B9; --line:#2A2F44;
  --accent:#9AAAF0; --accent-ink:#121630; --tint:#242B4A;
  --root:#F2A65A; --root-tint:#3A2A17; --good:#6CC992; --good-tint:#173022; --soft:#151826; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);min-height:100vh}
html[lang=ar] body{font-size:17px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
a.li,a.pill,a.btn{color:inherit;text-decoration:none}
a.pill.root{color:var(--root)}
nav.tabs[hidden]{display:none}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 18px var(--f-display);letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 13px var(--f-body);color:var(--mute)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 12px;font-size:14px;min-width:44px;min-height:36px}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;min-width:0;max-width:120px;border:0;background:none;padding:8px 1px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:600}
h1{font:700 22px/1.25 var(--f-display);margin:18px 0 4px}
html[lang=ar] h1,html[lang=ar] h2{font-family:var(--f-ar)}
h2{font:700 16px/1.3 var(--f-display);margin:0}
p{margin:0}
.lead{color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;min-height:46px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
html[lang=ar] .label{letter-spacing:0;font-size:13px}
.ru{font-family:var(--f-body);direction:ltr;unicode-bidi:isolate}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:start}
.li:first-child{border-top:0}

.li .s{font-size:14px;color:var(--mute)}
.chev{color:var(--mute);flex:none}
html[dir=rtl] .chev{transform:scaleX(-1)}
.meter{height:6px;border-radius:4px;background:var(--tint);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--ink);border:0;min-height:30px}
.pill.root{background:var(--root-tint);color:var(--root)}

.spk.big{width:64px;height:64px}
.spk.big svg{width:28px;height:28px}
.spk.playing{background:var(--tint)}
.body p+p,.body p+ul,.body ul+p,.body p+ol,.body ol+p{margin-top:10px}
.body ul,.body ol{margin:6px 0 0;padding-inline-start:22px}

.say svg{width:13px;height:13px;margin-inline-start:4px;vertical-align:-1px;color:var(--accent);opacity:.85}
.say.playing{background:var(--accent);color:var(--accent-ink)}
.say.playing svg{color:var(--accent-ink)}
.say{border:0;background:var(--tint);border-radius:6px;padding:0 5px;font-size:1.04em;color:var(--ink);font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;line-height:1.5}
.bridge{background:var(--root-tint);border-radius:14px;padding:14px;border:0}
.bridge .label{color:var(--root)}
.kind{font-size:13px;color:var(--mute)}
/* drill */
.drill{min-height:60vh;display:flex;flex-direction:column;gap:14px;padding-top:10px}
.dtop{display:flex;align-items:center;gap:10px}
.dtop .meter{flex:1;margin:0}
.x{border:0;background:none;width:40px;height:40px;font-size:22px;color:var(--mute)}

.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent)}

.center{display:flex;justify-content:center}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:19px;text-align:center;min-height:56px}

.typein{width:100%;font-size:22px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);direction:ltr;text-align:center}

.fact{font-size:14px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px}
.reading .line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.reading .line:first-child{border-top:0}
.reading .line .reveal{flex:1;text-align:start;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:4px}
.reading .rl{font-size:20px;line-height:1.45}
.reading .line.now .rl{color:var(--accent)}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px;font:13px/1.4 ui-monospace,monospace;direction:ltr}
.switch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.seg{flex-shrink:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-size:14px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.msg{font-size:14px;color:var(--good)}
.back{border:0;background:none;color:var(--accent);padding:12px 0 0;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.built{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-items:center;justify-content:center;direction:ltr}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-size:19px;min-height:46px;font-family:var(--f-body)}
.tile.on{background:var(--tint);border-color:var(--accent)}
.tile:disabled{opacity:.3}
.count{font-size:14px;color:var(--mute)}
.hear{align-self:center;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;min-height:38px}
.hear svg{width:16px;height:16px}
.say-it{font-size:22px;line-height:1.35;text-align:center;font-weight:500}
.base{text-align:center;color:var(--mute);font-size:15px}
.fbk{border:1px dashed var(--line);border-radius:12px;background:var(--surface);margin-top:12px}
.fbk>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px;min-height:40px}
.fbk>summary::-webkit-details-marker{display:none}
.fbk[open]>summary{color:var(--ink)}
.fbk-dot{color:var(--accent);font-weight:700}
.fbk-in{padding:0 12px 10px;display:flex;flex-direction:column;gap:4px}
.fbk-ta{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);direction:auto}
.fbk-s{font-size:12px;min-height:1em;color:var(--mute)}
.fbrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.fbrow p{white-space:pre-wrap;overflow-wrap:anywhere}
.fbrow small{color:var(--mute)}
.fbrow .x{width:36px;height:36px}
.fb-list>summary{cursor:pointer;color:var(--accent);font-weight:500;padding:4px 0}
.vid{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.kn{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="ru">Корень</span><small>Koren</small></div>
  <div class="lang" role="group" aria-label="Explanation language">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="ar" class="ar">ع</button>
  </div>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<audio id="player" preload="none"></audio>
<script src="course.js"></script>
<script>
/* Koren · Copyright © 2026 natmartem · SPDX-License-Identifier: AGPL-3.0-or-later
   localStorage "koren-state": progress and settings. "koren-packs": lessons added in the app.
   "koren-lyrics": song lyrics the learner pasted (never in the repo: copyright).
   IndexedDB "koren" → "audio", "audio2": recordings imported on this phone. */
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ACC=/́/g;
const plain=s=>String(s).replace(ACC,"");
const norm=s=>plain(s).toLowerCase().replace(/ё/g,"е").replace(/[.,!?¿¡—–\-«»"“”:;…]/g," ").replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);

/* ================= state ================= */
let S={v:1,lang:"en",srs:{},seen:{},ps:{},done:{},stressAll:false,tts:true,auto:true,read:{}};
let storageOK=true;
try{const raw=localStorage.getItem("koren-state");if(raw){const o=JSON.parse(raw);if(o&&typeof o==="object")S=Object.assign(S,o)}}catch(e){}
try{localStorage.setItem("koren-probe","1");localStorage.removeItem("koren-probe")}catch(e){storageOK=false}
const save=()=>{try{localStorage.setItem("koren-state",JSON.stringify(S))}catch(e){storageOK=false}};
const T=(en,ar)=>S.lang==="ar"?ar:en;
/* song lyrics: pasted by the learner, kept on this phone only */
let LYR={};
try{const o=JSON.parse(localStorage.getItem("koren-lyrics")||"{}");if(o&&typeof o==="object"&&!Array.isArray(o))LYR=o}catch(e){}
const saveLyr=()=>{try{localStorage.setItem("koren-lyrics",JSON.stringify(LYR));return true}catch(e){return false}};

/* ================= course, with lesson packs merged in ================= */
const BASE=window.COURSE||{topics:[],principles:[],words:[],phrases:[],readings:[],facts:[]};
let PACKS=[];
try{const a=JSON.parse(localStorage.getItem("koren-packs")||"[]");if(Array.isArray(a))PACKS=a}catch(e){}
const savePacks=()=>{try{localStorage.setItem("koren-packs",JSON.stringify(PACKS));return true}catch(e){return false}};
let TOP=[],PR=[],WORDS=[],PHRASES=[],READS=[],FACTS=[],ITEMS={},PITEMS={},TOPm={},PRm={};
/* combination tables (from course.js) and lookups built from them */
let N=[],ADJ=[],VERBS=[],FORMIDX=new Map(),BASEIDX={},STEPS=[],STEPm={};
let SONGS=[],SONGm={},LEX=new Map();
const POSS={m:"мой",f:"моя́",n:"моё",pl:"мои́"},TPOSS={m:"твой",f:"твоя́",n:"твоё",pl:"твои́"},DEM={m:"э́тот",f:"э́та",n:"э́то",pl:"э́ти"};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const prepOf=w=>w.split(" ")[0],nounOf=w=>w.split(" ").slice(1).join(" ");
const clean=t=>t.replace(/[.,!?«»"“”:;…()]/g,"");
const wkey=ru=>"W:"+plain(ru).toLowerCase();
const pkey=ru=>"P:"+plain(ru);
function build(){
  const c={topics:[...BASE.topics],principles:[...BASE.principles],words:[...BASE.words],phrases:[...BASE.phrases],readings:[...(BASE.readings||[])],facts:[...(BASE.facts||[])],songs:[...(BASE.songs||[])],nouns:[...(BASE.nouns||[])],adjs:[...(BASE.adjs||[])],verbs:[...(BASE.verbs||[])]};
  PACKS.forEach(p=>{
    (p.topics||[]).forEach(t=>{const i=c.topics.findIndex(x=>x.id===t.id);if(i<0)c.topics.push(t);else c.topics[i]=Object.assign({},c.topics[i],t)});
    (p.principles||[]).forEach(t=>{const i=c.principles.findIndex(x=>x.id===t.id);if(i<0)c.principles.push(t);else c.principles[i]=Object.assign({},c.principles[i],t)});
    ["words","phrases","readings","facts","nouns","adjs","verbs"].forEach(k=>{(p[k]||[]).forEach(x=>c[k].push(x))});
    (p.songs||[]).forEach(x=>{const i=c.songs.findIndex(y=>y.id===x.id);if(i<0)c.songs.push(x);else c.songs[i]=x});
  });
  TOP=c.topics;PR=c.principles;READS=c.readings;FACTS=c.facts;TOPm={};PRm={};ITEMS={};PITEMS={};
  SONGS=c.songs.filter(x=>x&&x.id&&Array.isArray(x.lessons));SONGm={};SONGS.forEach(x=>SONGm[x.id]=x);
  TOP.forEach(t=>TOPm[t.id]=t);PR.forEach(p=>PRm[p.id]=p);
  const mk=(a,kind)=>{const key=kind==="w"?wkey(a[0]):pkey(a[0]);
    if(ITEMS[key]){const o=ITEMS[key];(a[4]||"").split(/\s+/).filter(x=>x&&PRm[x.split(":")[0]]).forEach(x=>{if(!o.ps.includes(x))o.ps.push(x)});return null}
    const o={key,akey:key,kind,ru:a[0],en:a[1],ar:a[2],topic:a[3],ps:(a[4]||"").split(/\s+/).filter(x=>x&&PRm[x.split(":")[0]])};ITEMS[key]=o;return o};
  WORDS=c.words.map(a=>mk(a,"w")).filter(Boolean);
  PHRASES=c.phrases.map(a=>mk(a,"p")).filter(Boolean);
  PR.forEach(p=>{p.list=(p.items||[]).map((x,i)=>{
    let o;
    if(p.drill==="form")o={pid:p.id,part:x[8]||"",frame:x[0],hint:x[1],ans:x[2],wrong:[x[3],x[4],x[5]],en:x[6],ar:x[7],full:x[0].replace("…",x[2]).replace(/\s+([.?!,])/g,"$1")};
    else if(p.drill==="stress")o={pid:p.id,ru:x[0],en:(ITEMS[wkey(x[0])]||{}).en||"",ar:(ITEMS[wkey(x[0])]||{}).ar||""};
    else o={pid:p.id,ru:x[0],en:x[1],ar:x[2],root:x[3]||"",part:x[4]||""};
    o.part=o.part||"";o.tag=p.id+(o.part?":"+o.part:"");
    o.key="I:"+p.id+":"+plain(o.ans||o.ru)+"|"+plain(o.hint||"")+"|"+plain(o.frame||"");
    o.akey=p.drill==="form"?"S:"+plain(o.full):wkey(o.ru);
    PITEMS[o.key]=o;return o})});
  /* reading lines are items too, so they come back for review */
  READS.forEach(r=>(r.lines||[]).forEach(l=>{const key="L:"+plain(l[0]);if(!ITEMS[key])ITEMS[key]={key,akey:"S:"+plain(l[0]),kind:"l",ru:l[0],en:l[1],ar:l[2],topic:r.topic,ps:[],read:r.id}}));
  generate(c);
  buildLex();
  buildPath();
}
/* words from songs: their topic is off the path; they count once learned in a song */
const isSongWord=it=>!!(it&&TOPm[it.topic]&&TOPm[it.topic].song);
/* every form the course knows → the word keys it belongs to, to mark known words in pasted lyrics */
function buildLex(){
  LEX=new Map();const add=(f,k)=>{const n=norm(f);if(!n||n.includes(" "))return;const a=LEX.get(n);if(!a)LEX.set(n,[k]);else if(!a.includes(k))a.push(k)};
  WORDS.forEach(w=>add(w.ru,w.key));
  new Set(FORMIDX.values()).forEach(set=>{const ks=set.map(wkey).filter(k=>ITEMS[k]);if(ks.length)set.forEach(f=>ks.forEach(k=>add(f,k)))});
}
/* ================= combinations: vocabulary × principles =================
   Every noun, adjective and verb in the tables is put through every principle it fits,
   so each card gets many sentences built from the learner's own topics. Wrong options are
   always the same word in other forms. */
function generate(c){
  N=(c.nouns||[]).map(a=>({nom:a[0],en:a[1],ar:a[2],g:a[3],cat:a[4],where:a[5]||"",acc:a[6]||"",gen:a[7]||"",dat:a[8]||"",gpl:a[9]||"",song:isSongWord(ITEMS[wkey(a[0])])}));
  ADJ=(c.adjs||[]).map(a=>({f:{m:a[0],f:a[1],n:a[2],pl:a[3]},en:a[4],ar:a[5],cats:a[6]||""}));
  VERBS=(c.verbs||[]).map(a=>({inf:a[0],en:a[1],ar:a[2],forms:a.slice(3,9),compl:String(a[9]||"").split("|").filter(Boolean)}));
  FORMIDX=new Map();BASEIDX={};
  const addSet=set=>{set=[...new Set(set.filter(Boolean))];if(set.length<3)return;set.forEach(f=>{const k=plain(f).toLowerCase();if(!FORMIDX.has(k))FORMIDX.set(k,set)})};
  N.forEach(n=>{if(n.cat!=="M"&&n.cat!=="D")addSet([n.nom,n.acc,n.gen,n.dat,n.where&&nounOf(n.where),n.gpl])});
  VERBS.forEach(v=>{if(v.inf!=="есть")addSet([v.inf,...v.forms])});
  addSet(Object.values(POSS));addSet(Object.values(TPOSS));ADJ.forEach(a=>addSet(Object.values(a.f)));
  const ok=id=>PRm[id]&&PRm[id].drill==="form";
  const FULLS=new Set();PR.forEach(p=>(p.list||[]).forEach(x=>{if(x.full)FULLS.add(plain(x.full))}));
  const gi=(pid,frame,hint,ans,cands,base,meaning,part)=>{
    if(!ok(pid)||!ans)return;
    if(frame.startsWith("…")){ans=cap(ans);cands=cands.map(cap)}
    const wrong=[],seen=new Set([plain(ans).toLowerCase()]);
    for(const x of cands){if(!x)continue;const k=plain(x).toLowerCase();if(seen.has(k))continue;seen.add(k);wrong.push(x);if(wrong.length===3)break}
    if(wrong.length<2)return;
    const full=frame.replace("…",ans).replace(/\s+([.?!,])/g,"$1"),key="G:"+pid+":"+plain(full);if(PITEMS[key]||FULLS.has(plain(full)))return;FULLS.add(plain(full));
    part=part||"";const o={pid,part,tag:pid+(part?":"+part:""),frame,hint,ans,wrong,full,key,akey:"S:"+plain(full),gen:1,base:base?base.nom:"",
      en:meaning?meaning.en:base?base.nom+" — "+base.en:"",ar:meaning?meaning.ar:base?base.nom+" — "+base.ar:""};
    PITEMS[key]=o;PRm[pid].list.push(o);if(o.base){const k=wkey(o.base);(BASEIDX[k]=BASEIDX[k]||[]).push(o)}
  };
  const things=N.filter(n=>(n.cat==="F"||n.cat==="C")&&n.g!=="pl"&&!n.song).map(n=>n.nom); /* never put a song word into someone else's sentence */
  const WF={L:["Я сейча́с …","Мы …","Ма́ма …","Брат …"],C:["Я живу́ …","Сестра́ живёт …","Мы сейча́с …"],V:["Я сейча́с …","Мы …"],T:["Ключ …","Кот …","Телефо́н …","Кни́га …"],M:["Мой день рожде́ния …","Мы отдыха́ем …","… хо́лодно."]};
  const AF={P:["Я ви́жу …","Я люблю́ …","Я жду …","Я зна́ю …"],T:["Я ви́жу …","Я хочу́ …"],F:["Я люблю́ …"],L:["Я ви́жу …","Я люблю́ …"],C:["Я люблю́ …","Я зна́ю …"],V:["Я ви́жу …","Я жду …"]};
  const DF=["Я рабо́таю …","Мы отдыха́ем …","У меня́ уро́к …"];
  const HAVE=["У … есть маши́на.","У … есть телефо́н.","У … есть дом."],STATES=["хо́лодно","тепло́","бо́льно"];
  const end=f=>/[.?!]$/.test(f)?f:f+" .";
  N.forEach((n,i)=>{
    const pr=n.where?prepOf(n.where):"",other=pr==="в"?"на":"в",wn=n.where?nounOf(n.where):"";
    /* my, your, this, and describing words: every noun, plural ones too */
    if(n.cat!=="C"&&n.cat!=="M"&&n.cat!=="D"){
      const P2=i%2?TPOSS:POSS;const odd=n.g==="pl"||/ь$/.test(n.nom)||(n.g==="m"&&/[ая]$/.test(plain(n.nom)))||(n.g==="n"&&/мя$/.test(plain(n.nom)));
      if(n.cat!=="W")gi("moy-tvoy","Э́то … "+n.nom+".",P2.m,P2[n.g],Object.values(P2),n,null,odd&&n.g!=="pl"?"tricky":"");
      const fit=ADJ.filter(a=>a.cats.includes(n.cat));
      if(fit.length){const a1=fit[i%fit.length],a2=fit[(i+3)%fit.length];
        gi("moy-tvoy","Э́то … "+n.nom+".",a1.f.m,a1.f[n.g],Object.values(a1.f),n,null,"adj");
        if(a2!==a1)gi("moy-tvoy",cap(n.nom)+" … .",a2.f.m,a2.f[n.g],Object.values(a2.f),n,null,"adj")}
      gi("moy-tvoy","Где … "+n.nom+"?","э́тот",DEM[n.g],Object.values(DEM),n,null,"this");
    }
    if(n.g==="pl")return;
    /* on which day */
    if(n.cat==="D"){gi("acc-fem",end(DF[i%DF.length]),n.nom,n.where,[pr+" "+n.gen,pr+" "+n.dat,pr+" "+n.nom],n,null,"days");return}
    /* where */
    if(n.where&&wn!==n.nom&&WF[n.cat]){const fs=WF[n.cat];let f=fs[i%fs.length];if(n.cat==="T"&&f.startsWith(cap(n.nom)))f=fs[(i+1)%fs.length];
      gi("v-prep",end(f),n.nom,n.where,[pr+" "+n.nom,pr+" "+n.gen,pr+" "+n.dat,other+" "+wn],n,null,/(у́|ии)$/.test(wn)?"tricky":"")}
    if(n.cat==="M")return;
    /* where to */
    if(n.where&&n.acc&&(n.cat==="L"||n.cat==="C")&&n.nom!=="дом"){const ft=n.cat==="C"?["Мы е́дем …","Я е́ду …"]:["Я иду́ …","Мы идём …","Ма́ма идёт …"];
      gi("v-prep",end(ft[i%ft.length]),n.nom,pr+" "+n.acc,[n.where,pr+" "+n.gen,pr+" "+n.dat,other+" "+n.acc],n,null,"to")}
    /* objects */
    if(n.acc&&AF[n.cat]){const fs=AF[n.cat],fem=n.g==="f"||(n.g==="m"&&/[ая]$/.test(plain(n.nom)));
      gi(fem?"acc-fem":"acc-masc",end(fs[i%fs.length]),n.nom,n.acc,[n.nom,n.gen,n.dat,wn],n,null,fem&&(n.g!=="f"||/ь$/.test(n.nom)||plain(n.acc).replace(/у$/,"")!==plain(n.nom).replace(/а$/,""))?"tricky":"")}
    /* at someone's: у брата есть… / none: нет… / it hurts */
    if(n.cat==="P"&&n.gen)gi("u-menya",HAVE[i%HAVE.length],n.nom,n.gen,[n.nom,n.acc,n.dat],n,null,"net");
    if(n.gen&&(["T","F","V"].includes(n.cat)||n.nom==="вре́мя"))gi("u-menya","У меня́ нет … .",n.nom,n.gen,[n.nom,n.acc,n.dat],n,null,"net");
    if(n.cat==="B")gi("u-menya","У меня́ боли́т … .",n.nom,n.nom,[n.acc,n.gen,n.dat],n,null,"net");
    /* to whom: нравится, state words */
    if(n.cat==="P"&&n.dat){const C3=[cap(n.nom),cap(n.acc),cap(n.gen)];
      gi("nravitsya","… нра́вится "+things[i%things.length]+".",n.nom,cap(n.dat),C3,n);
      gi("nravitsya","… "+STATES[i%STATES.length]+".",n.nom,cap(n.dat),C3,n,null,"state")}
    if(["F","L","C","T"].includes(n.cat)&&n.acc)gi("nravitsya","Мне нра́вится … .",n.nom,n.nom,[n.acc,n.gen,n.dat],n);
    /* numbers */
    if(n.gpl&&n.gen&&n.cat!=="C"){
      const one={m:"оди́н",f:"одна́",n:"одно́"}[n.g],two={m:"два",f:"две",n:"два"}[n.g],cs=[n.nom,n.gen,n.gpl,n.dat];
      gi("numbers",cap(i%2?one:"два́дцать "+one)+" … .",n.nom,n.nom,cs,n);
      gi("numbers",cap([two,"три","четы́ре","два́дцать "+two][i%4])+" … .",n.nom,n.gen,cs,n);
      gi("numbers",cap(["пять","шесть","де́сять","два́дцать пять","сто"][i%5])+" … .",n.nom,n.gpl,cs,n);
    }
  });
  /* verb endings: every verb with every person */
  const PERS=[["Я",0],["Ты",1],["Он",2],["Она́",2],["Мы",3],["Вы",4],["Они́",5]];
  VERBS.forEach((v,vi)=>PERS.forEach(([pn,k],pi)=>{
    if(!v.forms[k])return;const compl=v.compl.length?" "+v.compl[(vi+pi)%v.compl.length]:"",neg=(vi*7+pi)%6===0;
    const cands=[...v.forms.filter((_,j)=>j!==k),v.inf],rot=(vi+pi)%cands.length;
    const iFam=!["знать","понима́ть","рабо́тать","чита́ть","обе́дать","отдыха́ть","ду́мать"].includes(v.inf); /* the first verb lesson drills regular -ать verbs only */
    const inf=/^(спать|чита́ть|рабо́тать)$/.test(v.compl[(vi+pi)%Math.max(1,v.compl.length)]||"");
    gi("ya-form",`${pn} ${neg?"не ":""}…${compl}${k===1?"?":"."}`,v.inf,v.forms[k],cands.slice(rot).concat(cands.slice(0,rot)),null,{en:v.inf+" — "+v.en,ar:v.inf+" — "+v.ar},inf?"inf":iFam?"i":"");
  }));
  /* stress: every word you have */
  if(PRm.stress){const have=new Set(PRm.stress.list.map(x=>plain(x.ru)));
    WORDS.forEach(w=>{const pw=plain(w.ru);if(have.has(pw)||/\s|ё/i.test(w.ru)||(pw.match(/[аеиоуыэюя]/gi)||[]).length<2)return;have.add(pw);
      const o={pid:"stress",part:"",tag:"stress",ru:w.ru,en:w.en,ar:w.ar,key:"I:stress:"+pw+"||",akey:w.key,gen:1};PITEMS[o.key]=o;PRm.stress.list.push(o)})}
}

/* ================= the path =================
   One line of small lessons that covers the whole course: every principle card, every word
   (topics are split into lessons of about six words), every phrase, every reading.
   A phrase is taught at the first step where its topic has been reached AND its grammar explained.
   A step is done when its lesson is finished. Practice only ever reviews what the path has taught. */
function buildPath(){
  STEPS=[];STEPm={};const order=[...(BASE.path||[])];
  TOP.forEach(t=>{if(!t.song&&!order.includes("t:"+t.id))order.push("t:"+t.id)});
  PR.forEach(x=>{if(!order.includes("p:"+x.id))order.push("p:"+x.id);(x.parts||[]).forEach(pt=>{if(!order.includes(`p:${x.id}:${pt.id}`))order.push(`p:${x.id}:${pt.id}`)})});
  READS.forEach(r=>{if(!order.includes("r:"+r.id))order.push("r:"+r.id)});
  order.forEach(st=>{const [k,id,part]=st.split(":");
    if(k==="t"&&TOPm[id]&&!TOPm[id].song){const ws=WORDS.filter(w=>w.topic===id);if(!ws.length)return;const n=Math.ceil(ws.length/7),size=Math.ceil(ws.length/n);
      for(let i=0;i<n;i++)STEPS.push({id:`t:${id}:${i+1}`,k:"t",topic:id,words:ws.slice(i*size,(i+1)*size),part:i+1,parts:n,phrases:[]})}
    else if(k==="p"&&PRm[id]&&(!part||(PRm[id].parts||[]).some(pt=>pt.id===part)))STEPS.push({id:"p:"+id+(part?":"+part:""),k:"p",pid:id,part:part||"",phrases:[]});
    else if(k==="r"&&READS.some(r=>r.id===id))STEPS.push({id:"r:"+id,k:"r",rid:id,phrases:[]});
  });
  STEPS.forEach((x,i)=>{x.i=i;STEPm[x.id]=x});
  PHRASES.forEach(ph=>{if(TOPm[ph.topic]&&TOPm[ph.topic].song)return; /* song sentences live on their song page */
    let idx=STEPS.findIndex(x=>x.topic===ph.topic);
    ph.ps.forEach(tag=>{let j=STEPS.findIndex(x=>x.id==="p:"+tag);if(j<0)j=STEPS.findIndex(x=>x.id==="p:"+tag.split(":")[0]);if(j>idx)idx=j});
    if(idx>=0)STEPS[idx].phrases.push(ph)});
}
const DRILLED=6;
function stepDone(x){
  if(!x)return false;if(S.done[x.id])return true;
  if(x.k==="p"){const k=x.pid+(x.part?":"+x.part:"");return !!(S.ps[k]&&S.ps[k].n>=DRILLED)}
  if(x.k==="r")return !!S.read[x.rid];
  return x.words.every(w=>S.seen[w.key])&&x.phrases.every(w=>S.seen[w.key]);
}
const unlocked=tag=>{const st=STEPm["p:"+tag];return st?stepDone(st):stepDone(STEPm["p:"+tag.split(":")[0]])};
const partOf=(pid,part)=>part?((PRm[pid].parts||[]).find(x=>x.id===part)||null):null;
const ready=it=>!it.ps||it.ps.every(unlocked);
const curStep=()=>STEPS.find(x=>!stepDone(x))||null;
function stepName(x){
  if(x.k==="t"){const t=TOPm[x.topic];return L(t)+(x.parts>1?` · ${x.part}/${x.parts}`:"")}
  if(x.k==="p"){const pt=partOf(x.pid,x.part);return pt?L(pt):L(PRm[x.pid])}
  const r=READS.find(y=>y.id===x.rid);return L(r);
}
function stepKind(x){return x.k==="t"?T("New words","كلمات جديدة"):x.k==="p"?T("Principle","مبدأ"):T("Reading","قراءة")}
function stepSub(x){
  if(x.k==="t")return x.words.slice(0,4).map(w=>plain(w.ru)).join(", ")+(x.words.length>4?"…":"");
  if(x.k==="p"){const pt=partOf(x.pid,x.part);return pt?T(`More on: ${L(PRm[x.pid])}`,`المزيد عن: ${L(PRm[x.pid])}`):L(PRm[x.pid].can)}
  const r=READS.find(y=>y.id===x.rid);return tname(r.topic);
}
function lessonQs(x){
  const q=[];
  if(x.k==="p"){q.push({t:"card",pid:x.pid,part:x.part});q.push(...principleQs(x.pid,8,x.part))}
  else if(x.k==="r"){q.push({t:"text",rid:x.rid});q.push(...readingQs(x.rid))}
  else{
    const set=x.words;set.filter(w=>!seenOrDrilled(w)).forEach(w=>q.push({t:"intro",it:w})); /* already learned (in a song, say): no new-word card, just practice */
    shuffle(set).forEach(w=>q.push(wordQ(w,"pm")));
    shuffle(set).slice(0,4).forEach(w=>q.push(wordQ(w,canPlay(w.key)&&Math.random()<.5?"lp":"pr")));
    shuffle(set).slice(0,2).forEach(w=>q.push(wordQ(w,"ty")));
    shuffle(set.flatMap(w=>BASEIDX[w.key]||[]).filter(y=>unlocked(y.tag))).slice(0,3).forEach(y=>{const z=principleQ(y,null);if(z)q.push(z)});
  }
  /* phrases that become sayable at this step */
  x.phrases.forEach(ph=>q.push({t:"intro",it:ph}));
  shuffle(x.phrases).forEach(ph=>{const z=gapQ(ph)||buildQ(ph)||wordQ(ph,"pm");if(z)q.push(z)});
  /* a little review of earlier steps */
  q.push(...reviewQs(3));
  return q.filter(Boolean);
}
function startStep(id){
  const x=STEPm[id];if(!x)return;
  startQ(lessonQs(x),"step",`Path step ${x.i+1}: ${x.k==="t"?TOPm[x.topic].en+(x.parts>1?` ${x.part}/${x.parts}`:""):x.k==="p"?PRm[x.pid].en+(x.part?" · "+partOf(x.pid,x.part).en:""):READS.find(r=>r.id===x.rid).en} (${x.id})`);
  if(Q)Q.stepId=id;
}
/* ================= practice: only what the path has taught ================= */
function poolOf(f){
  f=f||{};
  const met=x=>{const k=x.base?wkey(x.base):x.gen&&x.akey&&x.akey.startsWith("W:")?x.akey:null;if(!k)return true;const it=ITEMS[k];return !it||!!S.seen[it.key]||!!S.srs[it.key]};
  let items=[...WORDS,...PHRASES].filter(x=>(S.seen[x.key]||S.srs[x.key])&&ready(x));
  let lines=Object.values(ITEMS).filter(x=>x.kind==="l"&&(S.read[x.read]||S.done["r:"+x.read]));
  let pr=PR.filter(x=>unlocked(x.id)).flatMap(x=>x.list.filter(y=>met(y)&&unlocked(y.tag||x.id)));
  if(f.pid){items=items.filter(x=>x.ps.includes(f.pid));lines=[];pr=pr.filter(x=>x.pid===f.pid)}
  if(f.song){const ks=new Set(SONGm[f.song]?songItems(SONGm[f.song]).map(x=>x.key):[]);items=items.filter(x=>ks.has(x.key));lines=[];pr=pr.filter(x=>x.base&&ks.has(wkey(x.base)))}
  if(f.topic){items=items.filter(x=>x.topic===f.topic);lines=lines.filter(x=>x.topic===f.topic);pr=pr.filter(x=>x.base&&ITEMS[wkey(x.base)]&&ITEMS[wkey(x.base)].topic===f.topic)}
  return {items,lines,pr,size:items.length+lines.length+pr.length};
}
function practiceQs(f,n){
  n=n||15;const P=poolOf(f),d=today(),q=[],used=new Set();
  const due=k=>S.srs[k]&&S.srs[k].d<=d;
  const pick=(arr,k)=>shuffle(arr).sort((a,b)=>(due(a.key)?0:1)-(due(b.key)?0:1)).slice(0,k);
  const quota=[[P.pr,Math.ceil(n*.45)],[P.items,Math.ceil(n*.35)],[P.lines,Math.ceil(n*.2)]];
  quota.forEach(([arr,k])=>pick(arr,k).forEach(x=>{if(used.has(x.key))return;used.add(x.key);
    const z=x.pid?principleQ(x,Math.random()<.2?"type":["pick","mean","type"][Math.floor(Math.random()*3)]):itemQ(x);if(z)q.push(z)}));
  if(q.length<n){[...P.items,...P.pr,...P.lines].filter(x=>!used.has(x.key)).sort(()=>Math.random()-.5).slice(0,n-q.length).forEach(x=>{const z=x.pid?principleQ(x,null):itemQ(x);if(z)q.push(z)})}
  return shuffle(q).slice(0,n);
}
/* a sentence built on a song word waits until that word is learned in its song */
function songLocked(x){const k=x.base?wkey(x.base):x.akey&&x.akey.startsWith("W:")?x.akey:null;if(!k)return false;const it=ITEMS[k];return !!(it&&isSongWord(it)&&!seenOrDrilled(it))}
const nextPrinciple=()=>{const x=STEPS.find(y=>y.k==="p"&&!stepDone(y));return x?PRm[x.pid]:null};

const CYR=/[А-Яа-яЁё]/,OTHER=/[A-Za-z؀-ۿ]/;

function lyrRaw(text){

/* ================= practice: building questions ================= */
const lenScore=(a,b)=>Math.abs(plain(a).length-plain(b).length)+(plain(a).split(" ").length===plain(b).split(" ").length?0:6);
function pickDistr(it,pool,field){ /* similar length and word count; never the same meaning */
  const mean=x=>(x.en+"|"+x.ar),seen=new Set([mean(it),plain(it.ru)]);
  const cand=shuffle(pool).filter(x=>x!==it&&!seen.has(mean(x))&&!seen.has(plain(x.ru)))
    .sort((a,b)=>lenScore(a[field],it[field])-lenScore(b[field],it[field])).slice(0,6);
  const out=[];for(const x of shuffle(cand)){const k=mean(x)+plain(x.ru);if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length===3)break}
  return out;
}
function poolFor(it){const same=(it.kind==="p"?PHRASES:WORDS).filter(x=>x.topic===it.topic);return same.length>=6?same:same.concat(it.kind==="p"?PHRASES:WORDS)}
function wordQ(it,type){
  const pool=poolFor(it);
  if(type==="pm")return {t:"pm",it,opts:shuffle([it,...pickDistr(it,pool,S.lang)])};
  if(type==="pr"||type==="lp")return {t:type,it,opts:shuffle([it,...pickDistr(it,pool,"ru")])};
  return {t:type,it};
}
function reviewTypeFor(it){
  const b=(S.srs[it.key]||{}).b||0,listen=canPlay(it.key);
  if(it.kind==="p")return b<2?"pm":(listen&&Math.random()<.5?"lp":"pr");
  if(b<=1)return "pm";if(b===2)return listen&&Math.random()<.5?"lp":"pr";
  return listen&&Math.random()<.4?"lt":"ty";
}
function stressVariants(ru){
  const p=plain(ru);if(/ё/i.test(p))return null;
  const idx=[...p].map((c,i)=>/[аеиоуыэюяАЕИОУЫЭЮЯ]/.test(c)?i:-1).filter(i=>i>=0);if(idx.length<2)return null;
  const mk=i=>p.slice(0,i+1)+"́"+p.slice(i+1);
  const others=shuffle(idx.map(mk).filter(v=>v!==ru)).slice(0,3);
  return shuffle([ru,...others]);
}
function principleQ(x,mode){
  const p=PRm[x.pid];
  if(p.drill==="form")return mode==="type"?{t:"fty",x}:{t:"form",x,opts:shuffle([x.ans,...x.wrong])};
  if(p.drill==="stress"){const v=stressVariants(x.ru);return v?{t:"stress",x,opts:v}:null}
  const same=y=>x.root&&y.root===x.root?0:1;
  const others=shuffle(p.list.filter(y=>y!==x&&plain(y.ru)!==plain(x.ru))).sort((a,b)=>same(a)-same(b)||lenScore(a.ru,x.ru)-lenScore(b.ru,x.ru)).slice(0,5);
  const d=x.root?others.slice(0,3):shuffle(others).slice(0,3);
  if(p.drill==="read")return {t:"read",x,opts:shuffle([x,...d])};
  if(mode==="type")return {t:"pty",x};
  if(mode==="mean")return {t:"pmean",x,opts:shuffle([x,...d])};
  return {t:"pat",x,opts:shuffle([x,...d])};
}
function principleQs(pid,n,part){
  const p=PRm[pid];if(!p||!p.list||!p.list.length)return [];
  if(part!==undefined){const only=p.list.filter(x=>(x.part||"")===(part||""));if(only.length)return principleQsFrom(p,only,n)}
  return principleQsFrom(p,p.list,n);
}
function principleQsFrom(p,list,n){
  const d=today();
  /* prefer sentences built from words the learner has already met */
  const met=x=>{const k=x.base?wkey(x.base):x.gen&&x.akey&&x.akey.startsWith("W:")?x.akey:null;if(!k)return true;const it=ITEMS[k];return !it||!!seenOrDrilled(it)};
  let pool=list.filter(x=>!songLocked(x));if(p.drill==="stress"){const known=pool.filter(met);if(known.length>=n)pool=known}
  const ranked=shuffle(pool).sort((a,b)=>{const ra=S.srs[a.key],rb=S.srs[b.key];const sa=(ra?(ra.d<=d?0:2)+ra.b/10:1)+(met(a)?0:1.5),sb=(rb?(rb.d<=d?0:2)+rb.b/10:1)+(met(b)?0:1.5);return sa-sb});
  const pick=ranked.slice(0,n);
  return pick.map((x,i)=>principleQ(x,p.drill==="pattern"?(i<n/2?"pick":i<n*.75?"mean":"type"):p.drill==="form"&&i>=n-2?"type":null)).filter(Boolean);
}
function topicQs(id,learnNew){
  const ws=wordsOf(id),ph=phrasesOf(id),q=[];
  let fresh=ws.filter(w=>!seenOrDrilled(w)).slice(0,6);
  let set=fresh;
  if(learnNew&&fresh.length)fresh.forEach(w=>q.push({t:"intro",it:w}));
  if(!learnNew||!fresh.length){
    const d=today();
    set=shuffle(ws.filter(w=>seenOrDrilled(w))).sort((a,b)=>((S.srs[a.key]||{}).b||0)-((S.srs[b.key]||{}).b||0)).slice(0,6);
    if(set.length<4){const add=ws.filter(w=>!set.includes(w)).slice(0,4-set.length);add.forEach(w=>q.push({t:"intro",it:w}));set=set.concat(add)}
  }
  shuffle(set).forEach(w=>q.push(wordQ(w,"pm")));
  shuffle(set).slice(0,4).forEach(w=>q.push(wordQ(w,canPlay(w.key)&&Math.random()<.5?"lp":"pr")));
  shuffle(set).slice(0,2).forEach(w=>q.push(wordQ(w,"ty")));
  const phr=shuffle(ph.filter(ready)).slice(0,1);phr.forEach(x=>q.push(wordQ(x,"pm")));
  shuffle(ph.filter(ready)).slice(0,3).forEach((x,j)=>{const y=j%2?buildQ(x)||gapQ(x):gapQ(x)||buildQ(x);if(y)q.push(y)});
  shuffle(ws.flatMap(w=>BASEIDX[w.key]||[]).filter(x=>unlocked(x.pid))).slice(0,4).forEach(x=>{const y=principleQ(x,Math.random()<.25?"type":null);if(y)q.push(y)});
  const older=dueKeys().filter(k=>ITEMS[k]&&ITEMS[k].topic!==id).slice(0,2);
  older.forEach(k=>{const y=itemQ(ITEMS[k]);if(y)q.push(y)});
  return q;
}
function reviewQs(n){
  return dueKeys().filter(k=>!ITEMS[k]||ready(ITEMS[k])).slice(0,n).map(k=>ITEMS[k]?itemQ(ITEMS[k]):principleQ(PITEMS[k],["pick","mean","type"][Math.floor(Math.random()*3)])).filter(Boolean);
}
/* a gap in a real sentence: the missing word's other forms are the options */
function gapQ(it){
  const ts=it.ru.split(/\s+/),cand=ts.map((t,i)=>({i,c:clean(t)})).filter(x=>x.c&&FORMIDX.has(plain(x.c).toLowerCase()));
  if(!cand.length)return null;
  const pick=cand[Math.floor(Math.random()*cand.length)],set=FORMIDX.get(plain(pick.c).toLowerCase()),up=pick.c[0]!==pick.c[0].toLowerCase();
  const others=shuffle(set.filter(f=>plain(f).toLowerCase()!==plain(pick.c).toLowerCase())).slice(0,3).map(f=>up?cap(f):f);
  if(others.length<2)return null;
  return {t:"gap",it,frame:ts.map((t,i)=>i===pick.i?t.replace(pick.c,"…"):t).join(" "),ans:pick.c,opts:shuffle([pick.c,...others])};
}
/* build the sentence from word tiles, with one wrong form mixed in */
function buildQ(it){
  const toks=it.ru.replace(/[—–]/g," ").split(/\s+/).map(clean).filter(Boolean);
  if(toks.length<3||toks.length>8)return null;
  const tiles=toks.slice(),ci=toks.map((t,i)=>i).filter(i=>FORMIDX.has(plain(toks[i]).toLowerCase()));
  if(ci.length){const t=toks[ci[Math.floor(Math.random()*ci.length)]],set=FORMIDX.get(plain(t).toLowerCase());
    const alt=shuffle(set.filter(f=>plain(f).toLowerCase()!==plain(t).toLowerCase()))[0];if(alt)tiles.push(t[0]!==t[0].toLowerCase()?cap(alt):alt)}
  return {t:"build",it,target:toks,tiles:shuffle(tiles),built:[]};
}
const lineMeanQ=(it,pool)=>{const o=shuffle(pool.filter(x=>x!==it&&x.en!==it.en)).slice(0,3);return o.length>=2?{t:"pm",it,opts:shuffle([it,...o])}:null};
function itemQ(it){
  if(it.kind==="l"){const r=READS.find(x=>x.id===it.read),pool=r?r.lines.map(l=>ITEMS["L:"+plain(l[0])]).filter(Boolean):[];
    return [gapQ,buildQ][Math.floor(Math.random()*2)](it)||gapQ(it)||buildQ(it)||lineMeanQ(it,pool)}
  const b=(S.srs[it.key]||{}).b||0;
  if(it.kind==="p"&&b>=2&&Math.random()<.5)return gapQ(it)||buildQ(it)||wordQ(it,reviewTypeFor(it));
  return wordQ(it,reviewTypeFor(it));
}
function readingQs(id){
  const r=READS.find(x=>x.id===id);if(!r)return [];
  const its=r.lines.map(l=>ITEMS["L:"+plain(l[0])]).filter(Boolean),q=[];
  its.forEach((it,i)=>{let x=null;const k=i%4;
    if(k===0)x=lineMeanQ(it,its);
    else if(k===1)x=gapQ(it);
    else if(k===2)x=buildQ(it);
    else x=plain(it.ru).split(/\s+/).length<=4&&canPlay(it.akey)?{t:"lt",it}:gapQ(it);
    x=x||gapQ(it)||buildQ(it)||lineMeanQ(it,its);if(x)q.push(x)});
  shuffle(its).slice(0,2).forEach(it=>{const x=buildQ(it)||gapQ(it);if(x)q.push(x)});
  return q;
}

  Q={list,i:0,answered:false,title,src:src||"Practice",qid:Date.now().toString(36),res:[],right:0,touched:new Set(),finished:false,factShown:0,facts:new Set()};

/* what a question looked like, in words, for feedback notes */
const TASK={snote:"Song lesson card",fty:"Type the missing words",gap:"Fill the gap in a sentence",build:"Build the sentence from tiles",intro:"New word card",pm:"What does it mean?",pr:"Which one is it? (meaning → Russian)",lp:"Listen and pick",ty:"Type it in Russian",lt:"Listen and type",form:"Fill the gap",pat:"Which is the Russian word? (English → Russian)",pmean:"What does it mean? (rule word)",pty:"Use the rule: type it",stress:"Where is the stress?",read:"Read the sign"};
function qCtx(i){
  const Qr=Q,q=Q.list[i];
  return ()=>{
    const it=q.it||{},x=q.x||{},r=Qr.res[i];
    const opts=(q.opts||[]).map(o=>typeof o==="string"?o:o.ru+" ("+o.en+")").join(" | ");
    let prompt="";
    if(q.t==="form"||q.t==="fty")prompt=x.frame+(x.hint?" ("+x.hint+")":" — "+x.en);
    else if(q.t==="gap")prompt=q.frame+" — "+it.en;
    else if(q.t==="build")prompt=it.en+" · tiles: "+q.tiles.join(" | ");
    else if(q.x)prompt=(q.t==="pat"||q.t==="pty")?x.en:x.ru;
    else prompt=(q.t==="pr"||q.t==="ty")?it.en:it.ru;
    const ans=q.t==="form"||q.t==="fty"?x.full:(x.ru||it.ru||"");
    return {kind:"question",src:Qr.src,n:`${i+1}/${Qr.list.length}`,task:TASK[q.t]||q.t,prompt,opts,ans,
      item:[(it.ru||x.ru||x.ans||""),(it.en||x.en||"")].filter(Boolean).join(" — "),key:it.key||x.key||"",
      lang:S.lang==="ar"?"Arabic":"English",result:q.t==="intro"?"just shown":r===undefined?"not answered yet":r?"right":"wrong"};
  };
}

/* a fun fact only when it fits what was just practised: its principle, topic or one of its words */
function factFor(q){
  if(!FACTS.length||Q.factShown>=3||Math.random()>.4)return null;
  const it=q.it||q.x||{},ps=new Set(q.x?[q.x.pid]:it.ps||[]),topic=it.topic||(q.x&&q.x.base&&ITEMS[wkey(q.x.base)]?ITEMS[wkey(q.x.base)].topic:"");
  const text=[it.ru,q.x&&q.x.full,q.x&&q.x.base,q.x&&q.x.hint].filter(Boolean).join(" ");
  const toks=new Set(plain(text).toLowerCase().split(/[\s.,!?«»"“”:;…—–]+/).filter(Boolean));
  const words=new Set([...toks].flatMap(k=>FORMIDX.has(k)?FORMIDX.get(k).map(f=>plain(f).toLowerCase()):[k]));
  const list=v=>String(v||"").split(/\s+/).filter(Boolean);
  const byWord=[],general=[];
  FACTS.forEach(f=>{if(Q.facts.has(f))return;
    const w=list(f.w);
    if(w.length){if(w.some(x=>words.has(plain(x).toLowerCase())))byWord.push(f);return} /* a fact about words needs one of them here */
    if(list(f.p).some(x=>ps.has(x))||list(f.t).some(x=>x===topic))general.push(f)});
  const fits=byWord.length?byWord:general;
  return fits.length?fits[Math.floor(Math.random()*fits.length)]:null;
}

function autoPlay(){

function answer(given){
  if(Q.answered)return;Q.answered=true;
  const q=Q.list[Q.i],right=ansOf(q);
  const ok=TYPED.includes(q.t)?norm(given)===norm(right):given===right;
  const item=q.it||q.x,key=item.key;
  grade(key,ok);if(q.x){pstat(q.x.pid,ok);if(q.x.part)pstat(q.x.pid+":"+q.x.part,ok)}if(ok)Q.right++;Q.touched.add(key);Q.res[Q.i]=ok;save();fbRefresh("q:"+Q.qid+":"+Q.i);
  document.querySelectorAll("[data-ans]").forEach(b=>{b.disabled=true;if(b.dataset.ans===right)b.classList.add("ok");else if(b.dataset.ans===given)b.classList.add("dim")});
  const ti=$("#typein");if(ti)ti.disabled=true;
  document.querySelectorAll("[data-tile],[data-unbuild],[data-act=bcheck]").forEach(b=>b.disabled=true);
  const fullText=q.t==="form"||q.t==="fty"?q.x.full:(q.t==="gap"||q.t==="build")?q.it.ru:right;
  const audioKey=q.x?(q.x.akey):(item.akey||item.key),audioText=fullText;

  let html="";

    html=`<div class="fb"><div class="row"><span class="yes">✓ ${["form","fty","gap","build"].includes(q.t)?`<span class="ru">${esc(fullText)}</span>`:T("Yes","نعم")}</span>${spk(audioKey,audioText)}</div>`;
    const f=factFor(q);if(f){Q.factShown++;Q.facts.add(f);html+=`<p class="fact">${esc(L(f))}</p>`}

    html=`<div class="fb"><div class="row" style="justify-content:space-between"><div><div class="label">${T("The answer","الإجابة")}</div><div style="font-size:22px" class="ru">${esc(fullText)}</div>${q.t==="fty"||q.t==="build"?`<div class="lead">${T("You wrote","كتبت")}: <span class="ru">${esc(given)}</span></div>`:""}<div class="lead">${meaning}</div></div>${spk(audioKey,audioText)}</div>

  }
  if(autoOn()||!ok)play(audioKey,audioText); /* hear the right answer, whole sentence where there is one */
  html+=`<button type="button" class="btn primary wide" data-act="next">${Q.i+1<Q.list.length?T("Next","التالي"):T("Finish","إنهاء")}</button>`;

}

  if(a==="lyrrm"){if(t.dataset.sure){delete LYR[t.dataset.id];saveLyr();render();const c=$("#lyrics");if(c)c.scrollIntoView({block:"start"})}else{t.dataset.sure="1";t.textContent=T("Tap again to remove","اضغط مرة أخرى للحذف")}return}
  if(a==="practice"){const f=t.dataset.pid?{pid:t.dataset.pid}:t.dataset.topic?{topic:t.dataset.topic}:null;
    const l=practiceQs(f,15);if(!l.length)return;startQ(l,"practice",f?f.pid?`Practice: principle ${f.pid}`:`Practice: topic ${f.topic}`:"Mixed practice");if(Q)Q.filter=f;return}
  if(a==="ppractice")return startQ(principleQs(t.dataset.id,8),"principle",`Principle practice “${(PRm[t.dataset.id]||{}).en}” (id ${t.dataset.id})`);
  if(a==="bcheck"){const q=Q.list[Q.i];answer(q.built.map(i=>q.tiles[i]).join(" "));return}
  if(a==="rpractice"){const r=READS.find(x=>x.id===t.dataset.id);return startQ(readingQs(t.dataset.id),"reading",`Reading practice “${r?r.en:""}” (id ${t.dataset.id})`)}
  if(a==="check"){const v=($("#typein")||{}).value||"";if(!v.trim())return;answer(v);return}
  if(a==="next"){nextQ();return}
  if(a==="quit"){stopAudio();const back=Q&&Q.song?"#song/"+Q.song.id:Q&&Q.filter&&Q.filter.song?"#song/"+Q.filter.song:Q&&Q.title==="practice"?"#practice":Q&&Q.title==="step"?"#path":null;Q=null;location.hash=back||"#path";return}
  if(a==="again"){const f=Q&&Q.filter;const l=practiceQs(f,15);if(l.length){startQ(l,"practice",Q.src);Q.filter=f}return}
  if(a==="markread"){S.read[t.dataset.id]=S.read[t.dataset.id]?0:1;save();render();return}
  if(a==="stress"){S.stressAll=t.dataset.v==="1";save();render();return}
  if(a==="tts"){S.tts=t.dataset.v==="1";save();render();return}
  if(a==="auto"){S.auto=t.dataset.v==="1";save();render();return}
  if(a==="addpack"){addPack();return}
  if(a==="rmpack"){const i=+t.dataset.i;if(t.dataset.sure){PACKS.splice(i,1);savePacks();build();render()}else{t.dataset.sure="1";t.textContent=T("Tap again to remove","اضغط مرة أخرى للإزالة")}return}
  if(a==="backup"){backup();return}
  if(a==="fbcopy"){copyPrompt();return}
  if(a==="fbrm"){FB=FB.filter(x=>x.id!==t.dataset.id);saveFB();const op=!!$(".fb-list[open]");render();if(op){const d=$(".fb-list");if(d)d.open=true}return}
  if(a==="fbclear"){if(t.dataset.sure){FB=[];saveFB();render();const m=$("#fbmsg");if(m)m.textContent=T("All notes cleared.","حُذفت كل الملاحظات.")}else{t.dataset.sure="1";t.textContent=T(`Tap again to delete ${FB.length} notes`,`اضغط مرة أخرى لحذف ${FB.length} ملاحظة`)}return}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!Q||(e.target.matches&&e.target.matches("[data-fb]")))return;
  if(e.target.id==="typein"&&!Q.answered){e.preventDefault();const v=e.target.value;if(v.trim())answer(v);return}
  if(Q.answered&&!e.target.closest("a")){const nb=$('#fb [data-act="next"]');if(nb){e.preventDefault();nextQ()}}
});
document.addEventListener("change",async e=>{
  const t=e.target;if(!t.dataset||!t.files||!t.files[0])return;
  const f=t.files[0];let o=null;try{o=JSON.parse(await f.text())}catch(err){}
  if(t.dataset.act==="impaudio"){
    const m=$("#audmsg");if(!o||o.app!=="koren-audio"){m.textContent=T("That isn't a Koren recordings file.","هذا ليس ملف تسجيلات لكورين.");return}
    const sp=+o.speaker===2?2:1;try{await idbSet(sp===1?"audio":"audio2",o)}catch(err){}
    const n=addClips(o,"local",sp);m.textContent=T(`Added ${n} recordings (voice ${sp}).`,`أُضيف ${n} تسجيلًا (الصوت ${sp}).`);return;
  }
  if(t.dataset.act==="restore"){
    const m=$("#bkmsg");if(!o||o.app!=="koren-backup"||!o.state){m.textContent=T("That isn't a Koren backup file.","هذا ليس ملف نسخة احتياطية لكورين.");return}
    S=Object.assign(S,o.state);if(Array.isArray(o.packs))PACKS=o.packs;if(o.lyrics&&typeof o.lyrics==="object"&&!Array.isArray(o.lyrics)){LYR=o.lyrics;saveLyr()}if(Array.isArray(o.feedback)){FB=o.feedback.filter(x=>x&&typeof x.id==="string"&&typeof x.text==="string");saveFB()}save();savePacks();build();render();
    const m2=$("#bkmsg");if(m2)m2.textContent=T("Progress restored.","تمت استعادة التقدم.");
  }
});
function addPack(){
  const m=$("#packmsg"),txt=($("#packtxt")||{}).value||"";let o;
  try{o=JSON.parse(txt)}catch(e){m.textContent=T("That isn't valid JSON. Copy the whole pack, from { to }.","هذا ليس JSON صالحًا. انسخ الحزمة كاملة من { إلى }.");return}
  if(!o||typeof o!=="object"||!o.id){m.textContent=T("A pack needs an \"id\".","الحزمة تحتاج إلى \"id\".");return}
  const i=PACKS.findIndex(p=>p.id===o.id);if(i>=0)PACKS[i]=o;else PACKS.push(o);
  if(!savePacks()){m.textContent=T("Couldn't save the pack on this phone.","تعذّر حفظ الحزمة على هذا الهاتف.");return}
  build();render();const m2=$("#packmsg");if(m2)m2.textContent=T("Pack added.","أُضيفت الحزمة.");
}
/* ================= feedback for Claude ================= */
const FBORDER={general:0,topic:1,principle:2,question:3,drill:4,reading:5,song:6};
const fbSorted=()=>FB.slice().sort((a,b)=>((FBORDER[(a.ctx||{}).kind]??9)-(FBORDER[(b.ctx||{}).kind]??9))||(a.at-b.at));
function fbWhere(x){const c=x.ctx||{};if(c.kind==="question")return `${c.src} · ${c.n} · ${c.task}`;return c.src||"Note"}
function fbCard(){
  const list=fbSorted().filter(x=>x.id!=="g"),n=FB.length;
  return `<div class="card" id="fb-card"><span class="label">${T("Feedback for Claude","ملاحظات لـ Claude")} · ${n}</span>
   <p class="lead">${T("Notes you leave under questions, results, topics, principles and readings gather here. Copy them as one message, paste it into a chat with Claude, and the app gets updated on GitHub.","الملاحظات التي تتركها تحت الأسئلة والنتائج والمواضيع والمبادئ والقراءات تتجمّع هنا. انسخها في رسالة واحدة، والصقها في محادثة مع Claude، فيُحدَّث التطبيق على GitHub.")}</p>
   ${fbBox("g",()=>({kind:"general",src:"General"}),true)}
   <div class="row"><button type="button" class="btn small primary" data-act="fbcopy">${T("Copy update prompt","انسخ طلب التحديث")}</button>${n?`<button type="button" class="btn small" data-act="fbclear">${T("Clear all notes","احذف كل الملاحظات")}</button>`:""}</div>
   <textarea id="fb-out" readonly hidden aria-label="Update prompt"></textarea><p class="msg" id="fbmsg" aria-live="polite"></p>
   ${list.length?`<details class="fb-list"><summary>${T("Show notes","أظهر الملاحظات")} (${list.length})</summary>${list.map(x=>`<div class="fbrow"><div><small>${esc(fbWhere(x))}</small><p>${esc(x.text)}</p></div><button type="button" class="x" data-act="fbrm" data-id="${esc(x.id)}" aria-label="${T("Delete note","احذف الملاحظة")}">×</button></div>`).join("")}</details>`:""}</div>`;
}
function fbPrompt(){
  const notes=fbSorted(),out=[];
  out.push(`Here is feedback from using Koren ${APP_VERSION} (course v${BASE.version}) on a phone (${new Date().toISOString().slice(0,10)}). Please update the app in github.com/natmartem/Koren (index.html and course.js) to address it.

Keep progress, added lesson packs and recordings working, and don't change the app radically. Say briefly what you changed for each note (refer to them by number). If a note is unclear or you'd push back on it, say so instead of guessing.`);
  if(!notes.length){out.push("\n(No notes yet: write the feedback here.)");return out.join("\n")}
  const head={general:"General",topic:"Topics",principle:"Principles",question:"Drill questions",drill:"Whole drills",reading:"Readings",song:"Songs"};
  let lastK=null;
  notes.forEach((x,i)=>{
    const c=x.ctx||{},k=c.kind||"general";
    if(k!==lastK){out.push(`\n## ${head[k]||"Other"}`);lastK=k}
    const Ls=[`${i+1}. ${k==="question"?`${c.src}, question ${c.n}: “${c.task}”`:k==="general"?"General note":c.src||"Note"}${x.ver&&x.ver!==APP_VERSION?` (written in ${x.ver})`:""}`];
    if(k==="question"){
      if(c.prompt)Ls.push(`   Shown: ${c.prompt}`);
      if(c.opts)Ls.push(`   Options: ${c.opts}`);
      if(c.ans)Ls.push(`   Correct answer: ${c.ans} · result: ${c.result}`);
      if(c.item)Ls.push(`   Item: ${c.item}${c.key?` (${c.key})`:""}`);
      if(c.lang)Ls.push(`   Explanation language: ${c.lang}`);
    }
    if(k==="drill")Ls.push(`   Score: ${c.score}${c.wrong?` · missed: ${c.wrong}`:""}`);
    Ls.push(`   Note: ${x.text.trim().replace(/\n+/g,"\n   ")}`);
    out.push(Ls.join("\n"));
  });
  return out.join("\n");
}
async function copyPrompt(){
  const text=fbPrompt(),n=FB.length,m=$("#fbmsg");
  try{await navigator.clipboard.writeText(text);if(m)m.textContent=n?T(`Copied ${n} note${n>1?"s":""}. Paste into a chat with Claude. Clear them here once the update is in.`,`نُسخت ${n} ملاحظة. الصقها في محادثة مع Claude، ثم احذفها هنا بعد التحديث.`):T("Copied the prompt. There are no notes yet, so add your feedback in the chat.","نُسخ الطلب. لا توجد ملاحظات بعد، فاكتب ملاحظاتك في المحادثة.")}
  catch(e){const ta=$("#fb-out");if(ta){ta.hidden=false;ta.value=text;ta.focus();ta.select()}if(m)m.textContent=T("Couldn't copy automatically. The text is in the box: select all and copy.","تعذّر النسخ التلقائي. النص في المربع: حدّده كله وانسخه.")}
}
function backup(){
  const data=JSON.stringify({app:"koren-backup",v:1,made:new Date().toISOString(),state:S,packs:PACKS,feedback:FB,lyrics:LYR});
  const file=new File([data],"koren-backup-"+new Date().toISOString().slice(0,10)+".json",{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Koren backup"}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  const m=$("#bkmsg");if(m)m.textContent=T("Backup saved to your downloads.","حُفظت النسخة في التنزيلات.");
}
window.addEventListener("hashchange",()=>{LYRMSG=null;if(SEQ){stopSeq();try{speechSynthesis.cancel()}catch(e){}player.pause()}render();window.scrollTo(0,0)});
render();loadAudio();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
