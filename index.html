<style>
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --ink:#161A2B; --mute:#5B6177; --line:#D5D9E6;
  --accent:#34468C; --accent-ink:#FFFFFF; --tint:#E0E5F4;
  --root:#A9580A; --root-tint:#F6E7D3; --good:#226B45; --good-tint:#DCEFE3; --soft:#F4F5FA;
  --f-body:'Onest','Noto Naskh Arabic',system-ui,sans-serif; --f-display:'Unbounded','Onest','Noto Naskh Arabic',system-ui,sans-serif;
  --f-ar:'Noto Naskh Arabic','Onest',serif; color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#11131C; --surface:#191C29; --ink:#E7E9F2; --mute:#9CA2B9; --line:#2A2F44;
  --accent:#9AAAF0; --accent-ink:#121630; --tint:#242B4A;
  --root:#F2A65A; --root-tint:#3A2A17; --good:#6CC992; --good-tint:#173022; --soft:#151826; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);min-height:100vh}
html[lang=ar] body{font-size:17px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
a.li,a.pill,a.btn{color:inherit;text-decoration:none}
a.pill.root{color:var(--root)}
nav.tabs[hidden]{display:none}
/* Listen mode */
.ap{align-items:stretch;text-align:center;gap:10px}
.ap-part{font-weight:600;color:var(--mute);min-height:1.5em}
.ap-stage{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ap-cue{font-size:14px;font-weight:600;color:var(--mute);min-height:1.4em;padding:2px 12px;border-radius:999px;transition:background .2s,color .2s}
.ap-cue.say{background:var(--accent);color:var(--accent-ink)}
.ap-ru{font:600 30px/1.3 var(--f-body);border:0;background:none;padding:4px 8px;max-width:100%;overflow-wrap:anywhere}
.ap-ru:disabled{color:inherit;cursor:default}
.ap-mean{font-size:18px;color:var(--mute)}
#ap-ytbox{width:100%}
.ap-ctl{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:4px}
.ap-b{border:0;background:none;color:var(--ink);width:48px;height:48px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ap-b.ap-pp{width:68px;height:68px;background:var(--accent);color:var(--accent-ink)}
.mini{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:11;max-width:664px;margin:0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 6px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.mini[hidden]{display:none}
.mini-t{border:0;background:none;min-width:0;text-align:start;display:flex;flex-direction:column;padding:4px 2px}
.mini-t .ru{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mini-t small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.has-mini .wrap{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}

.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 18px var(--f-display);letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 13px var(--f-body);color:var(--mute)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 12px;font-size:14px;min-width:44px;min-height:36px}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;min-width:0;max-width:120px;border:0;background:none;padding:8px 1px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:600}
h1{font:700 22px/1.25 var(--f-display);margin:18px 0 4px}
html[lang=ar] h1,html[lang=ar] h2{font-family:var(--f-ar)}
h2{font:700 16px/1.3 var(--f-display);margin:0}
p{margin:0}
.lead{color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;min-height:46px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
html[lang=ar] .label{letter-spacing:0;font-size:13px}
.ru{font-family:var(--f-body);direction:ltr;unicode-bidi:isolate}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:start}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:14px;color:var(--mute)}
.chev{color:var(--mute);flex:none}
html[dir=rtl] .chev{transform:scaleX(-1)}
.meter{height:6px;border-radius:4px;background:var(--tint);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--ink);border:0;min-height:30px}
.pill.root{background:var(--root-tint);color:var(--root)}
.pill.good{background:var(--good-tint);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.word{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word .reveal{flex:1;min-width:0;text-align:start;background:none;border:0;padding:4px 0;display:flex;flex-direction:column;gap:2px}
.word .w{font-size:21px;line-height:1.3}
.word .m{font-size:15px;color:var(--mute)}
.word .m[hidden]{display:none}
.tap-hint{font-size:13px;color:var(--mute)}
.spk{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--soft);display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.spk.big{width:64px;height:64px}
.spk.big svg{width:28px;height:28px}
.spk.playing{background:var(--tint)}
.body p+p,.body p+ul,.body ul+p,.body p+ol,.body ol+p{margin-top:10px}
.body ul,.body ol{margin:6px 0 0;padding-inline-start:22px}
.body li+li{margin-top:4px}
.say svg{width:13px;height:13px;margin-inline-start:4px;vertical-align:-1px;color:var(--accent);opacity:.85}
.say.playing{background:var(--accent);color:var(--accent-ink)}
.say.playing svg{color:var(--accent-ink)}
.say{border:0;background:var(--tint);border-radius:6px;padding:0 5px;font-size:1.04em;color:var(--ink);font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;line-height:1.5}
.bridge{background:var(--root-tint);border-radius:14px;padding:14px;border:0}
.bridge .label{color:var(--root)}
.kind{font-size:13px;color:var(--mute)}
/* drill */
.drill{min-height:60vh;display:flex;flex-direction:column;gap:14px;padding-top:10px}
.dtop{display:flex;align-items:center;gap:10px}
.dtop .meter{flex:1;margin:0}
.x{border:0;background:none;width:40px;height:40px;font-size:22px;color:var(--mute)}
.prompt{color:var(--mute);font-size:15px}
.big{font-size:34px;line-height:1.25;font-weight:500;text-align:center;margin:6px 0;word-break:break-word}
.big.latin{font-family:var(--f-body)}
.sign{align-self:center;background:#1F3D8C;color:#fff;font:700 26px var(--f-body);letter-spacing:.06em;padding:10px 20px;border-radius:6px;direction:ltr}
.frame{font-size:24px;line-height:1.4;text-align:center}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent)}
.hint{text-align:center;color:var(--mute)}
.center{display:flex;justify-content:center}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:19px;text-align:center;min-height:56px}
.opt.ok{border-color:var(--accent);background:var(--tint);font-weight:600}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default;color:var(--ink)}
.typein{width:100%;font-size:22px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);direction:ltr;text-align:center}
.fb{border-radius:14px;padding:12px 14px;background:var(--soft);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fb .yes{color:var(--accent);font-weight:600}
.fact{font-size:14px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px}
.reading .line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.reading .line:first-child{border-top:0}
.reading .line .reveal{flex:1;text-align:start;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:4px}
.reading .rl{font-size:20px;line-height:1.45}
.reading .line.now .rl{color:var(--accent)}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px;font:13px/1.4 ui-monospace,monospace;direction:ltr}
.switch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.seg{flex-shrink:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-size:14px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.msg{font-size:14px;color:var(--good)}
.back{border:0;background:none;color:var(--accent);padding:12px 0 0;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.built{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-items:center;justify-content:center;direction:ltr}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-size:19px;min-height:46px;font-family:var(--f-body)}
.tile.on{background:var(--tint);border-color:var(--accent)}
.tile:disabled{opacity:.3}
.count{font-size:14px;color:var(--mute)}
.hear{align-self:center;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;min-height:38px}
.hear svg{width:16px;height:16px}
.say-it{font-size:22px;line-height:1.35;text-align:center;font-weight:500}
.base{text-align:center;color:var(--mute);font-size:15px}
.fbk{border:1px dashed var(--line);border-radius:12px;background:var(--surface);margin-top:12px}
.fbk>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px;min-height:40px}
.fbk>summary::-webkit-details-marker{display:none}
.fbk[open]>summary{color:var(--ink)}
.fbk-dot{color:var(--accent);font-weight:700}
.fbk-in{padding:0 12px 10px;display:flex;flex-direction:column;gap:4px}
.fbk-ta{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);direction:auto}
.fbk-s{font-size:12px;min-height:1em;color:var(--mute)}
.fbrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.fbrow p{white-space:pre-wrap;overflow-wrap:anywhere}
.fbrow small{color:var(--mute)}
.fbrow .x{width:36px;height:36px}
.fb-list>summary{cursor:pointer;color:var(--accent);font-weight:500;padding:4px 0}
.vid{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.kn{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="ru">Корень</span><small>Koren</small></div>
  <div class="lang" role="group" aria-label="Explanation language">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="ar" class="ar">ع</button>
  </div>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<audio id="player" preload="none"></audio>
<audio id="aplayer" preload="auto" playsinline></audio>
<div class="mini" id="mini" hidden></div>
<script src="course.js"></script>
<script src="lyrics.js"></script>
<script>
/* Koren · Copyright © 2026 natmartem · SPDX-License-Identifier: AGPL-3.0-or-later
   localStorage "koren-state": progress and settings. "koren-packs": lessons added in the app.
   "koren-lyrics": song lyrics the learner pasted (never in the repo: copyright).
   IndexedDB "koren" → "audio", "audio2": recordings imported on this phone; "lines1", "lines2": song and poem lines
   (kept off GitHub: lyrics are copyrighted); "songfile:<id>": the learner's own audio file of a song. */
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ACC=/́/g;
const plain=s=>String(s).replace(ACC,"");
const norm=s=>plain(s).toLowerCase().replace(/ё/g,"е").replace(/[.,!?¿¡—–\-«»"“”:;…]/g," ").replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);

/* ================= state ================= */
let S={v:1,lang:"en",gender:"f",srs:{},seen:{},ps:{},done:{},stressAll:false,tts:true,auto:true,read:{}};
let storageOK=true;
try{const raw=localStorage.getItem("koren-state");if(raw){const o=JSON.parse(raw);if(o&&typeof o==="object")S=Object.assign(S,o)}}catch(e){}
try{localStorage.setItem("koren-probe","1");localStorage.removeItem("koren-probe")}catch(e){storageOK=false}
const save=()=>{try{localStorage.setItem("koren-state",JSON.stringify(S))}catch(e){storageOK=false}};
/* state migrations: progress is never wiped, only carried forward */
if(!(S.v>=2)){S.rd=Object.assign({},S.read||{});S.v=2;save()} /* v2: a reading counts once drilled; readings marked read before stay counted */
/* Gendered text: ⟦feminine|masculine⟧ anywhere in course or app text. Women are the default;
   Settings → "Speak to me as" switches the Arabic address and the Russian the learner says about herself. */
const GM=/⟦([^|⟧]*)\|([^⟧]*)⟧/g;
const G=s=>typeof s==="string"&&s.includes("⟦")?s.replace(GM,S.gender==="m"?"$2":"$1"):s;
let ALTS=new Map(); /* typed answers: the other gender's version of a gendered sentence is accepted too */
const GX=v=>{if(typeof v==="string"){if(!v.includes("⟦"))return v;const r=G(v);if(/[а-яё]/i.test(v)&&!v.includes("<")&&v.length<300){const o=v.replace(GM,S.gender==="m"?"$1":"$2");ALTS.set(norm(r),norm(o))}return r}
  if(Array.isArray(v))return v.map(GX);if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=GX(v[k]);return o}return v};
const T=(en,ar)=>S.lang==="ar"?G(ar):en;
/* song lyrics: pasted by the learner, kept on this phone only */
let LYR={};
try{const o=JSON.parse(localStorage.getItem("koren-lyrics")||"{}");if(o&&typeof o==="object"&&!Array.isArray(o))LYR=o}catch(e){}
const saveLyr=()=>{try{localStorage.setItem("koren-lyrics",JSON.stringify(LYR));return true}catch(e){return false}};

/* ================= course, with lesson packs merged in ================= */
const BASE=window.COURSE||{topics:[],principles:[],words:[],phrases:[],readings:[],facts:[]};
let PACKS=[];
try{const a=JSON.parse(localStorage.getItem("koren-packs")||"[]");if(Array.isArray(a))PACKS=a}catch(e){}
const PACKSRAW=()=>PACKS;
const savePacks=()=>{try{localStorage.setItem("koren-packs",JSON.stringify(PACKS));return true}catch(e){return false}};
let TOP=[],PR=[],WORDS=[],PHRASES=[],READS=[],FACTS=[],ITEMS={},PITEMS={},TOPm={},PRm={};
/* combination tables (from course.js) and lookups built from them */
let N=[],ADJ=[],VERBS=[],FORMIDX=new Map(),BASEIDX={},STEPS=[],STEPm={};
let SONGS=[],SONGm={},LEX=new Map();
const PRON=[["я","меня́","мне"],["ты","тебя́","тебе́"],["он","его́","ему́"],["она́","её","ей"],["мы","нас","нам"],["вы","вас","вам"],["они́","их","им"]];
const POSS={m:"мой",f:"моя́",n:"моё",pl:"мои́"},TPOSS={m:"твой",f:"твоя́",n:"твоё",pl:"твои́"},DEM={m:"э́тот",f:"э́та",n:"э́то",pl:"э́ти"};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const prepOf=w=>w.split(" ")[0],nounOf=w=>w.split(" ").slice(1).join(" ");
const clean=t=>t.replace(/[.,!?«»"“”:;…()]/g,"");
const wkey=ru=>"W:"+plain(ru).toLowerCase();
const pkey=ru=>"P:"+plain(ru);
function build(){
  ALTS=new Map();const BASE=GX(window.COURSE||{topics:[],principles:[],words:[],phrases:[],readings:[],facts:[]}),PACKS=GX(PACKSRAW());
  const c={topics:[...BASE.topics],principles:[...BASE.principles],words:[...BASE.words],phrases:[...BASE.phrases],readings:[...(BASE.readings||[])],facts:[...(BASE.facts||[])],songs:[...(BASE.songs||[])],nouns:[...(BASE.nouns||[])],adjs:[...(BASE.adjs||[])],verbs:[...(BASE.verbs||[])]};
  PACKS.forEach(p=>{
    (p.topics||[]).forEach(t=>{const i=c.topics.findIndex(x=>x.id===t.id);if(i<0)c.topics.push(t);else c.topics[i]=Object.assign({},c.topics[i],t)});
    (p.principles||[]).forEach(t=>{const i=c.principles.findIndex(x=>x.id===t.id);if(i<0)c.principles.push(t);else c.principles[i]=Object.assign({},c.principles[i],t)});
    ["words","phrases","readings","facts","nouns","adjs","verbs"].forEach(k=>{(p[k]||[]).forEach(x=>c[k].push(x))});

/* ================= the path =================
   One line of small lessons that covers the whole course: every principle card, every word
   (topics are split into lessons of about six words), every phrase, every reading.
   A phrase is taught at the first step where its topic has been reached AND its grammar explained.
   A step is done when its lesson is finished. Practice only ever reviews what the path has taught. */
function buildPath(){
  STEPS=[];STEPm={};const order=[...(BASE.path||[])];
  TOP.forEach(t=>{if(!t.song&&!order.includes("t:"+t.id))order.push("t:"+t.id)});
  PR.forEach(x=>{if(!order.includes("p:"+x.id))order.push("p:"+x.id);(x.parts||[]).forEach(pt=>{if(!order.includes(`p:${x.id}:${pt.id}`))order.push(`p:${x.id}:${pt.id}`)})});
  READS.forEach(r=>{if(!order.includes("r:"+r.id))order.push("r:"+r.id)});
  /* a topic is cut into lessons of about seven words; "t:hello" places all of its lessons not placed by name ("t:hello:3") elsewhere in the path */
  const chunks={};TOP.forEach(t=>{const ws=WORDS.filter(w=>w.topic===t.id);if(!ws.length||t.song)return;const n=Math.ceil(ws.length/7),size=Math.ceil(ws.length/n);
    chunks[t.id]=[];for(let i=0;i<n;i++)chunks[t.id].push({id:`t:${t.id}:${i+1}`,k:"t",topic:t.id,words:ws.slice(i*size,(i+1)*size),part:i+1,parts:n,phrases:[]})});
  const named=new Set(order.filter(x=>/^t:[^:]+:\d+$/.test(x)));
  order.forEach(st=>{const [k,id,part]=st.split(":");
    if(k==="t"&&chunks[id]){if(part){const c=chunks[id][+part-1];if(c&&!STEPm[c.id]){STEPS.push(c);STEPm[c.id]=c}}
      else chunks[id].forEach(c=>{if(!named.has(c.id)&&!STEPm[c.id]){STEPS.push(c);STEPm[c.id]=c}})}
    else if(k==="p"&&PRm[id]&&(!part||(PRm[id].parts||[]).some(pt=>pt.id===part)))STEPS.push({id:"p:"+id+(part?":"+part:""),k:"p",pid:id,part:part||"",phrases:[]});
    else if(k==="r"&&READS.some(r=>r.id===id))STEPS.push({id:"r:"+id,k:"r",rid:id,phrases:[]});
  });
  STEPm={};STEPS.forEach((x,i)=>{x.i=i;STEPm[x.id]=x});
  PHRASES.forEach(ph=>{if(TOPm[ph.topic]&&TOPm[ph.topic].song)return; /* song sentences live on their song page */
    let idx=STEPS.findIndex(x=>x.topic===ph.topic);
    ph.ps.forEach(tag=>{let j=STEPS.findIndex(x=>x.id==="p:"+tag);if(j<0)j=STEPS.findIndex(x=>x.id==="p:"+tag.split(":")[0]);if(j>idx)idx=j});
    if(idx>=0)STEPS[idx].phrases.push(ph)});
}
const DRILLED=6;
function stepDone(x){
  if(!x)return false;
  /* new words: done when every word and phrase has been answered right at least once, so a word added later still gets taught */
  if(x.k==="t")return x.words.every(w=>rightOnce(w.key))&&x.phrases.every(w=>rightOnce(w.key));
  if(S.done[x.id])return true;
  if(x.k==="p"){const k=x.pid+(x.part?":"+x.part:"");const s=S.ps[k];return !!(s&&s.n>=DRILLED&&s.r.slice(-DRILLED).reduce((a,b)=>a+b,0)>=DRILLED*.6)}
  return !!(S.rd&&S.rd[x.rid]); /* a reading: done once its drills are, not when it's opened */
}
const unlocked=tag=>{const st=STEPm["p:"+tag];return st?stepDone(st):stepDone(STEPm["p:"+tag.split(":")[0]])};
const partOf=(pid,part)=>part?((PRm[pid].parts||[]).find(x=>x.id===part)||null):null;
const ready=it=>!it.ps||it.ps.every(unlocked);
const curStep=()=>STEPS.find(x=>!stepDone(x))||null;
function stepName(x){

}
function stepKind(x){return x.k==="t"?T("New words","كلمات جديدة"):x.k==="p"?T("Principle","مبدأ"):T("Reading","قراءة")}
function stepSub(x){

function lessonQs(x){ /* built against what she knows plus what this step teaches */
  return withK(x.k==="t"?KT([...x.words,...x.phrases].map(w=>w.key),[]):x.k==="p"?KT(x.phrases.map(w=>w.key),[x.pid+(x.part?":"+x.part:"")]):KT(x.phrases.map(w=>w.key),[]),()=>lessonQs0(x));

function lessonQs0(x){
  const q=[];
  if(x.k==="p"){q.push({t:"card",pid:x.pid,part:x.part});q.push(...principleQs(x.pid,8,x.part))}
  else if(x.k==="r"){q.push({t:"text",rid:x.rid});q.push(...readingQs(x.rid))}
  else{
    const set=x.words;set.filter(w=>!seenOrDrilled(w)).forEach(w=>q.push({t:"intro",it:w})); /* already learned (in a song, say): no new-word card, just practice */
    shuffle(set).forEach(w=>q.push(wordQ(w,"pm")));

function poolOf(f){

  /* only what she has answered right at least once, and only sentences whose every word and ending she knows */
  let items=[...WORDS,...PHRASES].filter(x=>rightOnce(x.key)&&ready(x));

  let pr=PR.filter(x=>unlocked(x.id)).flatMap(x=>x.list.filter(y=>met(y)&&unlocked(y.tag||x.id)&&!songLocked(y)&&itemFits(y,KL)));
  if(f.pid){items=items.filter(x=>x.ps.includes(f.pid));lines=[];pr=pr.filter(x=>x.pid===f.pid)}
  if(f.song){const ks=new Set(SONGm[f.song]?songItems(SONGm[f.song]).map(x=>x.key):[]);items=items.filter(x=>ks.has(x.key));lines=[];pr=pr.filter(x=>x.base&&ks.has(wkey(x.base)))}
  if(f.topic){items=items.filter(x=>x.topic===f.topic);lines=lines.filter(x=>x.topic===f.topic);pr=pr.filter(x=>x.base&&ITEMS[wkey(x.base)]&&ITEMS[wkey(x.base)].topic===f.topic)}

}
function practiceQs(f,n){

  const quota=[[P.pr,Math.ceil(n*.45)],[P.items,Math.ceil(n*.35)],[P.lines,Math.ceil(n*.2)]];
  quota.forEach(([arr,k])=>pick(arr,k).forEach(x=>{if(used.has(x.key))return;used.add(x.key);
    const z=x.pid?principleQ(x,modeFor(x))||principleQ(x,null):itemQ(x);if(z)q.push(z)}));

function renderTabs(cur){
  const tabs=[["path",T("Path","المسار")],["practice",T("Practice","التدريب")],["songs",T("Culture","ثقافة")],["topics",T("Topics","المواضيع")],["principles",T("Principles","المبادئ")],["more",T("More","المزيد")]];
  $("#tabs").innerHTML=tabs.map(([id,n])=>`<button type="button" data-go="#${id}" ${cur===id?'aria-current="page"':""}>${ICON[id]}<span>${n}</span></button>`).join("");
}

/* ================= views ================= */
let Q=null; /* the running practice: {list,i,answered,title,back,done:[]} */
function render(){
  document.documentElement.lang=S.lang==="ar"?"ar":"en";document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===S.lang)));
  const h=(location.hash||"#path").slice(1),[v,arg,sub]=h.split("/");
  $("#tabs").hidden=(v==="drill"&&!!Q);
  if(v==="drill"&&Q){
    if(Q.answered&&!Q.finished){Q.answered=false;Q.i++;if(Q.i>=Q.list.length)Q.finished=true} /* back from a card: carry on with the next one */
    apUI();return renderQ()}
  const tab={topic:"topics",p:"principles",r:"topics",read:"topics",today:"path",song:"songs",listen:"practice"}[v]||v;renderTabs(tab);
  const view=$("#view");
  const back=Q&&!Q.finished?`<button type="button" class="back" data-go="#drill">← ${T("Back to practice","العودة إلى التدريب")}</button>`:"";
  let html="";
  if(v==="topics")html=vTopics();
  else if(v==="topic"&&TOPm[arg])html=vTopic(arg);
  else if(v==="principles")html=vPrinciples();
  else if(v==="p"&&PRm[arg])html=vPrinciple(arg);
  else if(v==="read")html=vTopics();
  else if(v==="practice")html=vPractice();
  else if(v==="r")html=vReading(arg);
  else if(v==="more")html=vMore();
  else if(v==="songs")html=vSongs();
  else if(v==="song"&&SONGm[arg])html=vSong(arg);
  else if(v==="listen")html=arg==="play"?vListenPlay():vListen();
  else html=vPath();
  if(AP.yt){try{AP.yt.destroy()}catch(e){}AP.yt=null;AP.on=false} /* the video lives on the player screen */
  view.innerHTML=back+html;
  apShown=-1;apUI();if(v==="listen"&&arg==="play"&&AP.mode==="yt")setTimeout(()=>ytMount(),0);
  if(sub==="lyrics")setTimeout(()=>{const el=$("#lyrics");if(el)el.scrollIntoView({block:"start"})},60);
}
function stepRow(x,cur){
  const d=stepDone(x),isCur=cur&&cur.id===x.id;
  return `<button type="button" class="li" data-act="step" data-id="${esc(x.id)}"><span class="pill${d?" good":""}" style="min-width:34px;justify-content:center;${isCur?"background:var(--accent);color:var(--accent-ink)":""}">${d?"✓":x.i+1}</span><div class="grow"><div class="t">${esc(stepName(x))}</div><div class="s">${esc(stepKind(x))} · ${esc(stepSub(x))}</div></div>${CHEV}</button>`;
}

  <div class="card"><span class="label">${T("On the go","في الطريق")}</span><p class="lead">${T("Listen and repeat with headphones, no screen needed.","استمع⟦ي|⟧ وردّد⟦ي|⟧ بالسماعات، بلا حاجة إلى الشاشة.")}</p><button type="button" class="btn wide" data-go="#listen">${HEADI} ${T("Listen and repeat","استمع⟦ي|⟧ وردّد⟦ي|⟧")}</button></div>

function songQs(s,li){ /* the lesson's words and lines are what it teaches; everything else must already be known */

  return withK(KT([...ws,...ph].map(x=>x.key),[]),()=>songQs0(s,li,l,ws,ph));
}
function songQs0(s,li,l,ws,ph){
  const q=[{t:"snote",sid:s.id,li}];
  ws.filter(w=>!seenOrDrilled(w)).forEach(w=>q.push({t:"intro",it:w}));
  shuffle(ws).forEach(w=>q.push(wordQ(w,"pm")));
  shuffle(ws).slice(0,4).forEach(w=>q.push(wordQ(w,canPlay(w.key)&&Math.random()<.5?"lp":"pr")));
  shuffle(ws.filter(w=>plain(w.ru).length<=7)).slice(0,2).forEach(w=>q.push(wordQ(w,"ty")));
  /* sentences only once their grammar cards are done on the path */
  const ok=ph.filter(ready);
  ok.filter(x=>!seenOrDrilled(x)).forEach(x=>q.push({t:"intro",it:x}));
  shuffle(ok).forEach(x=>{const z=gapQ(x)||buildQ(x)||wordQ(x,"pm");if(z)q.push(z)});
  shuffle(ws.flatMap(w=>BASEIDX[w.key]||[]).filter(y=>unlocked(y.tag)&&itemFits(y,QK))).slice(0,3).forEach(y=>{const z=principleQ(y,null);if(z)q.push(z)});
  q.push(...reviewQs(2));
  return q.filter(Boolean);
}

/* ================= Listen: hands-free listen and repeat =================
   For the street, the bus, the kitchen. The app plays recordings in a set order and leaves a pause after
   each one so the learner can say it aloud. Nothing is checked, scored or counted as progress.
   - Recorded items are "baked" into one WAV per block (clips + pauses + chimes), so playback goes on with the
     screen locked and the lock screen shows play/pause/next. The phone voice (no recording) needs the screen on.
   - Pause after an item = its own length × 1.4 + 0.8 s (min 1.6 s, max 9 s), times the Short/Medium/Long setting.
   - Words and sentences: heard N times (voice 1, then voice 2 if there is one), each followed by a pause.
   - Readings and dialogues: the whole text → line by line with pauses → the whole text again.
   - Songs and poems: the song (the learner's own audio file, or the video) → line by line with pauses → the song again.
     Song lines are recorded line by line on the recorder page and stay on the phone (lyrics are copyrighted). */
const AU_DEF={pause:"m",reps:2,song:1};
const AU=()=>Object.assign({},AU_DEF,S.au||{});
const PMULT={s:.75,m:1,l:1.45};
const SR=22050;
const aplayer=$("#aplayer");
const AP={sess:null,steps:[],i:0,on:false,mode:"",blk:null,next:null,tok:0,timer:null,yt:null,ytVid:"",say:false,done:false,blocked:false,quiet:false,fileUrl:null,onEnd:null};

/* --- sound building blocks --- */
function wavBlob(parts,n){
  const b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  const out=new Int16Array(b,44,n);let o=0;
  for(const p of parts)for(let i=0;i<p.length;i++){const s=p[i]>1?1:p[i]<-1?-1:p[i];out[o++]=s<0?s*32768:s*32767}
  return new Blob([b],{type:"audio/wav"});
}
const SILENT=URL.createObjectURL(wavBlob([new Float32Array(SR/10)],SR/10));
let CH=null;
function chime(){ /* two soft notes: a new part starts */
  if(CH)return CH;const n=Math.round(SR*.45),y=new Float32Array(n);
  [[0,659.25],[.16,987.77]].forEach(([t0,f])=>{const s=Math.round(t0*SR),L=Math.round(SR*.28);
    for(let i=0;i<L&&s+i<n;i++){const e=Math.exp(-i/(SR*.07))*Math.min(1,i/(SR*.004));y[s+i]+=.2*e*Math.sin(2*Math.PI*f*i/SR)}});
  return CH=y;
}
function resample(x,from){
  if(!from||from===SR)return x;const r=from/SR,n=Math.floor(x.length/r),y=new Float32Array(n);
  for(let i=0;i<n;i++){const p=i*r,k=Math.floor(p),f=p-k;y[i]=(x[k]||0)*(1-f)+(x[k+1]||0)*f}return y;
}
function tidy(x){ /* cut the silence before and after the voice, even out the volume, soften the edges */
  let pk=0;for(let i=0;i<x.length;i++){const a=Math.abs(x[i]);if(a>pk)pk=a}
  if(pk<1e-4)return null;
  const th=pk*.06;let a=0,b=x.length-1;
  while(a<b&&Math.abs(x[a])<th)a++;while(b>a&&Math.abs(x[b])<th)b--;
  a=Math.max(0,a-Math.round(SR*.12));b=Math.min(x.length,b+Math.round(SR*.2));
  const g=Math.min(4,.9/pk),y=new Float32Array(Math.max(1,b-a));for(let i=0;i<y.length;i++)y[i]=x[a+i]*g;
  const f=Math.min(Math.round(SR*.01),y.length>>1);for(let i=0;i<f;i++){y[i]*=i/f;y[y.length-1-i]*=i/f}
  return y;
}
function clipBytes(c){const bin=atob(c.d),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function clipURL(c){if(!c.url)c.url=URL.createObjectURL(new Blob([clipBytes(c)],{type:c.m}));return c.url}
function decodeClip(c){
  if(c.pcm)return Promise.resolve(c.pcm);if(c.bad)return Promise.resolve(null);
  return new Promise(res=>{
    let ctx;const fail=()=>{c.bad=true;res(null)};
    try{const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;ctx=new OAC(1,SR,SR)}catch(e){return fail()}
    const ok=b=>{try{let x=b.getChannelData(0);
      if(b.numberOfChannels>1){const y=b.getChannelData(1),m=new Float32Array(x.length);for(let i=0;i<x.length;i++)m[i]=(x[i]+y[i])/2;x=m}
      const t=tidy(resample(x,b.sampleRate));if(!t)return fail();c.pcm=t;res(t)}catch(e){fail()}};
    try{const p=ctx.decodeAudioData(clipBytes(c).buffer,ok,fail);if(p&&p.catch)p.catch(()=>{})}catch(e){fail()}
  });
}
/* voice 1 for the first hearing, voice 2 for the second when there is one */
const pickClip=(arr,v)=>arr.find(x=>x.sp===(v%2?2:1))||arr[v%arr.length]||arr[0];
const estDur=t=>Math.max(.7,plain(t||"").length/12);
function gapAfter(st,dur){
  if(st.gap!=null)return st.gap;
  if(!st.rep)return 450;
  return Math.round(Math.min(9000,Math.max(1600,dur*1400+800))*(PMULT[AU().pause]||1));
}
const playable=st=>st.t==="say"&&(audOf(st.k)||ttsOK());

/* --- sessions: a title and parts; each step is a chime, a "say" or a song --- */
function Sess(title,sub){
  let item=0,part="";const steps=[];
  const S1={title,sub:sub||"",steps,
    part(label){part=label;steps.push({t:"chime",part:label,item:++item})},
    say(k,text,mean,o){steps.push(Object.assign({t:"say",k,text,mean:mean||null,part,item:o&&o.same?item:++item},o||{}))},
    reps(it,n){const id=++item;for(let r=0;r<n;r++)steps.push({t:"say",k:it.akey||it.key,text:it.ru,mean:it,rep:1,v:r,part,item:id})},
    whole(lines,gap){lines.forEach(l=>steps.push({t:"say",k:l.k,text:l.ru,mean:l,gap:gap==null?500:gap,part,item:++item}))},
    lines(lines,n){lines.forEach(l=>{const id=++item;for(let r=0;r<n;r++)steps.push({t:"say",k:l.k,text:l.ru,mean:l,rep:1,v:r,part,item:id})})},
    song(id){steps.push({t:"song",id,part,item:++item})}};
  return S1;
}
const readLines=r=>(r.lines||[]).map(l=>({k:"S:"+plain(l[0]),ru:l[0],en:l[1],ar:l[2]}));
const isDialog=r=>(r.lines||[]).filter(l=>/^\s*[—–-]/.test(l[0])).length>=2;
const songLines=s=>lyrParse(lyrOf(s.id)).filter(x=>x.ru).map(x=>({k:"S:"+plain(x.ru),ru:x.ru,tr:x.tr||""}));
function addReading(z,r,reps){
  const L=readLines(r),d=isDialog(r),nm=L0(r);
  z.part(d?T(`Dialogue: ${nm}. Just listen`,`حوار: ${nm}. استمع⟦ي|⟧ فقط`):T(`Text: ${nm}. Just listen`,`نص: ${nm}. استمع⟦ي|⟧ فقط`));z.whole(L);
  z.part(T("Your turn: line by line. Say each line in the pause","دور⟦كِ|ك⟧: سطرًا سطرًا. ⟦قولي|قل⟧ كل سطر في الوقفة"));z.lines(L,reps);
  z.part(T("The whole text again","النص كاملًا مرة أخرى"));z.whole(L);
}
function addSong(z,s,reps,short){
  const L=songLines(s),poem=isPoem(s);
  z.part(poem?T(`Poem: ${plain(s.ru)}. Just listen`,`قصيدة: ${plain(s.ru)}. استمع⟦ي|⟧ فقط`):T(`Song: ${plain(s.ru)}. Just listen`,`أغنية: ${plain(s.ru)}. استمع⟦ي|⟧ فقط`));
  if(poem)z.whole(L,700);else z.song(s.id);
  if(!L.length)return;
  z.part(T("Your turn: line by line. Say each line in the pause","دور⟦كِ|ك⟧: سطرًا سطرًا. ⟦قولي|قل⟧ كل سطر في الوقفة"));z.lines(L,short?1:reps);
  if(short)return;
  z.part(poem?T("The whole poem again","القصيدة كاملة مرة أخرى"):T("The song again","الأغنية مرة أخرى"));
  if(poem)z.whole(L,700);else z.song(s.id);
}
const L0=o=>o?(S.lang==="ar"?o.ar:o.en):"";
function mixReading(){
  const cur=curStep();
  if(cur&&cur.k==="r")return READS.find(r=>r.id===cur.rid);
  const before=STEPS.filter(x=>x.k==="r"&&stepDone(x)&&(!cur||x.i<cur.i));
  const pick=before.length?before[before.length-1]:STEPS.find(x=>x.k==="r");
  return pick?READS.find(r=>r.id===pick.rid):null;
}
const songsWithLines=()=>SONGS.filter(s=>songLines(s).length);
function mixSong(){
  const L=songsWithLines();if(!L.length)return null;
  const started=L.filter(s=>s.lessons.some((_,i)=>S.done[sdKey(s.id,i)]));
  const pool=started.length?started:L;return pool[today()%pool.length];
}
function sessMix(){
  const A=AU(),cur=curStep(),due=new Set(dueKeys());
  const learned=WORDS.filter(w=>seenOrDrilled(w));
  const oldW=[...learned.filter(w=>due.has(w.key)),...shuffle(learned.filter(w=>!due.has(w.key)))].slice(0,12);
  const newW=cur&&cur.k==="t"?cur.words.filter(w=>!seenOrDrilled(w)):[];
  const oldP=shuffle(PHRASES.filter(p=>seenOrDrilled(p)&&ready(p))).slice(0,6);
  const newP=cur?cur.phrases.filter(p=>!seenOrDrilled(p)):[];
  const pex=cur&&cur.k==="p"?(PRm[cur.pid].ex||[]).map(x=>({key:"S:"+plain(x[0]),akey:"S:"+plain(x[0]),ru:x[0],en:x[1],ar:x[2]})):[];
  const z=Sess(T("Today's listening","استماع اليوم"),T("Words, sentences and a text from your path","كلمات وجمل ونص من مسارك"));
  if(oldW.length){z.part(T("Words you know. Say each one after the voice","كلمات تعرف⟦ين|⟧ها. ⟦ردّديها|ردّدها⟧ بعد الصوت"));oldW.forEach(w=>z.reps(w,A.reps))}
  if(newW.length){z.part(T("Coming up next on your path: first listen","التالي في مسارك: استماع أول"));newW.forEach(w=>z.reps(w,A.reps))}
  const ph=[...oldP,...newP,...pex];
  if(ph.length){z.part(T("Sentences. Say each one after the voice","جمل. ⟦ردّديها|ردّدها⟧ بعد الصوت"));ph.forEach(p=>z.reps(p,A.reps))}
  const r=mixReading();if(r)addReading(z,r,A.reps);
  const echo=[...oldW,...newW];
  if(echo.length>3){z.part(T("Once more, from the start","مرة أخرى، من البداية"));shuffle(echo).forEach(w=>z.reps(w,1))}
  const s=A.song?mixSong():null;if(s)addSong(z,s,A.reps,true);

}
function sessReading(id){const r=READS.find(x=>x.id===id);if(!r)return null;const z=Sess(L0(r),isDialog(r)?T("Dialogue","حوار"):T("Text","نص"));addReading(z,r,AU().reps);return z}
function sessSong(id){const s=SONGm[id];if(!s)return null;const z=Sess(plain(s.ru),plain(s.by));addSong(z,s,AU().reps,false);return z}
function sessTopic(id){
  const t=TOPm[id];if(!t)return null;const A=AU(),z=Sess(L0(t),T("Words and sentences","كلمات وجمل"));
  const ws=wordsOf(id),ps=phrasesOf(id);
  if(ws.length){z.part(T("Words. Say each one after the voice","كلمات. ⟦ردّديها|ردّدها⟧ بعد الصوت"));ws.forEach(w=>z.reps(w,A.reps))}
  if(ps.length){z.part(T("Sentences. Say each one after the voice","جمل. ⟦ردّديها|ردّدها⟧ بعد الصوت"));ps.forEach(p=>z.reps(p,A.reps))}
  return z;
}
function sessInfo(z){
  if(!z)return {min:0,rec:0,n:0};let sec=0,rec=0,n=0;const seen=new Set();
  z.steps.forEach(st=>{if(st.t==="chime")sec+=.8;else if(st.t==="song")sec+=210;
    else{const d=estDur(st.text);sec+=d+gapAfter(st,d)/1000;if(!seen.has(st.k)){seen.add(st.k);n++;if(audOf(st.k))rec++}}});
  return {min:Math.max(1,Math.round(sec/60)),rec,n};
}

/* --- the player --- */
async function bakeFrom(i,tok){ /* clips, pauses and chimes from step i on, as one WAV (up to 4 minutes) */
  const parts=[],offs=[];let n=0,j=i;
  while(j<AP.steps.length&&n<SR*240){
    const st=AP.steps[j];
    if(st.t==="chime"){const c=chime(),g=new Float32Array(Math.round(SR*.4));offs.push({j,t0:n/SR,t1:(n+c.length)/SR});parts.push(c,g);n+=c.length+g.length;j++;continue}
    if(st.t!=="say"||st.live)break;
    const arr=audOf(st.k);if(!arr)break;
    const pcm=await decodeClip(pickClip(arr,st.v||0));if(tok!==AP.tok)return null;
    if(!pcm){st.live=1;break}
    const g=new Float32Array(Math.round(SR*gapAfter(st,pcm.length/SR)/1000));
    offs.push({j,t0:n/SR,t1:(n+pcm.length)/SR});parts.push(pcm,g);n+=pcm.length+g.length;j++;
  }
  if(j===i)return null;
  return {start:i,end:j,offs,url:URL.createObjectURL(wavBlob(parts,n))};
}
const bakeable=st=>st&&(st.t==="chime"||(st.t==="say"&&!st.live&&!!audOf(st.k)));
function apClear(keep){
  clearTimeout(AP.timer);AP.onEnd=null;AP.say=false;AP.blocked=false;
  try{speechSynthesis.cancel()}catch(e){}
  AP.quiet=true;try{aplayer.pause()}catch(e){}AP.quiet=false;
  if(AP.yt){try{AP.yt.destroy()}catch(e){}AP.yt=null}
  if(AP.blk){URL.revokeObjectURL(AP.blk.url);AP.blk=null}
  if(AP.fileUrl){URL.revokeObjectURL(AP.fileUrl);AP.fileUrl=null}
  if(!keep&&AP.next){AP.next.p.then(b=>{if(b)URL.revokeObjectURL(b.url)});AP.next=null}
  AP.mode="";
}
function apPlay(){AP.on=true;const p=aplayer.play();if(p&&p.catch)p.catch(()=>{AP.blocked=true;AP.on=false;apUI()})}
async function apGo(i,keep){
  const tok=++AP.tok;apClear(keep);AP.on=true;
  if(i>=AP.steps.length){apFinish();return}
  AP.i=Math.max(0,i);AP.done=false;apUI();
  const st=AP.steps[AP.i];
  if(st.t==="song")return apSong(st,tok);
  if(bakeable(st)){
    let b=null;if(AP.next&&AP.next.start===AP.i){b=await AP.next.p;AP.next=null}
    if(!b&&tok===AP.tok)b=await bakeFrom(AP.i,tok);
    if(tok!==AP.tok){if(b)URL.revokeObjectURL(b.url);return}
    if(b){AP.blk=b;AP.mode="blk";aplayer.src=b.url;apPlay();
      if(bakeable(AP.steps[b.end]))AP.next={start:b.end,p:bakeFrom(b.end,tok)};return}
  }
  apLive(st,tok);
}
function apLive(st,tok){
  AP.mode="live";
  const fin=dur=>{if(tok!==AP.tok)return;AP.say=!!st.rep;apUI();AP.timer=setTimeout(()=>{if(tok===AP.tok)apGo(AP.i+1,true)},gapAfter(st,dur))};
  if(st.t!=="say")return apGo(AP.i+1,true);
  const arr=audOf(st.k);
  if(arr){AP.mode="file";aplayer.src=clipURL(pickClip(arr,st.v||0));AP.onEnd=()=>fin(aplayer.duration||estDur(st.text));apPlay();return}
  if(ttsOK()){const t0=Date.now();let ended=false;const end=d=>{if(ended)return;ended=true;clearTimeout(AP.timer);fin(d)};
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(st.text));u.lang="ru-RU";u.rate=.85;if(ruVoice)u.voice=ruVoice;
      u.onend=()=>end((Date.now()-t0)/1000);u.onerror=()=>end(estDur(st.text));speechSynthesis.speak(u);
      AP.timer=setTimeout(()=>{if(tok===AP.tok)end(estDur(st.text))},estDur(st.text)*2500+3000)}catch(e){end(estDur(st.text))} /* some phones never say "ended" */
    return}
  AP.timer=setTimeout(()=>{if(tok===AP.tok)apGo(AP.i+1,true)},50); /* nothing to play it with: skip */
}
async function apSong(st,tok){
  const s=SONGm[st.id];let f=null;
  try{f=await idbGet("songfile:"+st.id)}catch(e){}
  if(tok!==AP.tok)return;
  if(f&&f.blob){AP.mode="file";AP.fileUrl=URL.createObjectURL(f.blob);aplayer.src=AP.fileUrl;AP.onEnd=()=>apGo(AP.i+1);apPlay();return}
  if(s&&s.video&&navigator.onLine!==false){AP.mode="yt";AP.ytVid=s.video;apUI();ytMount(tok);return}
  AP.mode="skip";apUI();AP.timer=setTimeout(()=>{if(tok===AP.tok)apGo(AP.i+1)},3000);
}
let YTP=null;
function ytAPI(){
  if(window.YT&&window.YT.Player)return Promise.resolve();if(YTP)return YTP;
  YTP=new Promise((res,rej)=>{const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{if(prev)prev();res()};
    const sc=document.createElement("script");sc.src="https://www.youtube.com/iframe_api";sc.onerror=()=>{YTP=null;rej(new Error("yt"))};document.head.appendChild(sc)});
  return YTP;
}
async function ytMount(tok){
  tok=tok||AP.tok;
  try{await ytAPI()}catch(e){if(tok===AP.tok&&AP.mode==="yt"){AP.mode="skip";apUI();AP.timer=setTimeout(()=>{if(tok===AP.tok)apGo(AP.i+1)},3000)}return}
  const el=$("#ap-yt");if(tok!==AP.tok||AP.mode!=="yt"||!el||AP.yt)return; /* not on the player screen: it starts when they open it */
  AP.on=false;apUI();
  AP.yt=new YT.Player(el,{videoId:AP.ytVid,host:"https://www.youtube-nocookie.com",playerVars:{autoplay:1,playsinline:1,rel:0},
    events:{onReady:e=>{try{e.target.playVideo()}catch(x){}},
      onStateChange:e=>{if(tok!==AP.tok)return;if(e.data===1){AP.on=true;apUI()}else if(e.data===2){AP.on=false;apUI()}else if(e.data===0)apGo(AP.i+1)}}});
}
function apFinish(){AP.on=false;AP.done=true;AP.mode="";apUI();msState()}
function apPause(){
  if(!AP.sess)return;AP.on=false;
  if(AP.mode==="yt"){try{AP.yt.pauseVideo()}catch(e){}}
  else if(AP.mode==="blk"||AP.mode==="file"){AP.quiet=true;aplayer.pause();AP.quiet=false}
  else{AP.tok++;clearTimeout(AP.timer);try{speechSynthesis.cancel()}catch(e){}}
  apUI();
}
function apResume(){
  if(!AP.sess)return;if(AP.done)return apGo(0);
  if(AP.mode==="yt"){try{AP.yt.playVideo()}catch(e){}AP.on=true}
  else if((AP.mode==="blk"||AP.mode==="file")&&aplayer.src&&!aplayer.ended)apPlay();
  else apGo(AP.i);
  apUI();
}
function apJump(i){ /* inside the current block: just seek */
  i=Math.max(0,Math.min(i,AP.steps.length-1));
  const b=AP.blk;
  if(AP.mode==="blk"&&b&&i>=b.start&&i<b.end){const o=b.offs.find(x=>x.j===i);if(o){aplayer.currentTime=o.t0;AP.i=i;if(!AP.on)apPlay();apUI();return}}
  apGo(i);
}
function apSkip(d){ /* by item: the repetitions of a word count as one */
  const st=AP.steps,cur=st[AP.i];if(!cur)return;let i=AP.i;
  if(d>0){while(i<st.length&&st[i].item===cur.item)i++;if(i>=st.length){apGo(st.length);return}}
  else if(d<0){while(i>0&&st[i-1].item===cur.item)i--;if(i>0){const it=st[i-1].item;i--;while(i>0&&st[i-1].item===it)i--}}
  else{while(i>0&&st[i-1].item===cur.item)i--}
  apJump(i);
}
function apStart(z){
  if(!z||!z.steps.some(st=>st.t==="song"||playable(st)))return false;
  apClear();AP.sess=z;AP.steps=z.steps;AP.i=0;AP.done=false;msInit();apGo(0);return true;
}
function apStop(){AP.tok++;apClear();AP.on=false;AP.sess=null;AP.steps=[];AP.done=false;try{aplayer.removeAttribute("src");aplayer.load()}catch(e){}
  if("mediaSession" in navigator){try{navigator.mediaSession.metadata=null}catch(e){}}msState();apUI()}

function apUnlock(){try{aplayer.src=SILENT;const p=aplayer.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  if(ttsOK()){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}}

  if(AP.mode!=="blk"||!AP.blk)return;const t=aplayer.currentTime,o=AP.blk.offs;let k=0;

/* ================= practice: building questions =================
   QK is what the learner knows while a set of questions is built: KL in Practice, and KL plus what the
   lesson is teaching inside a path step. Every option, gap and tile is checked against it. */
let QK=KL;
const withK=(K,f)=>{const o=QK;QK=K;try{return f()}finally{QK=o}};
const lenScore=(a,b)=>Math.abs(plain(a).length-plain(b).length)+(plain(a).split(" ").length===plain(b).split(" ").length?0:6);
function pickDistr(it,pool,field){ /* similar length and word count; never the same meaning */
  const mean=x=>(x.en+"|"+x.ar),seen=new Set([mean(it),plain(it.ru)]);
  const cand=shuffle(pool).filter(x=>x!==it&&!seen.has(mean(x))&&!seen.has(plain(x.ru)))
    .sort((a,b)=>lenScore(a[field],it[field])-lenScore(b[field],it[field])).slice(0,6);
  const out=[];for(const x of shuffle(cand)){const k=mean(x)+plain(x.ru);if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length===3)break}
  return out;
}

function autoPlay(){
  if(!Q||Q.finished)return;const q=Q.list[Q.i];if(!q)return;
  /* listening drills always play; otherwise only where the Russian is already on screen, so sound never gives the answer away */
  if(q.t==="lp"||q.t==="lt")play(q.it.akey||q.it.key,q.it.ru);
  else if(q.t==="stress"&&!q.mem)play(q.x.akey,q.x.ru); /* stress drills are listening drills (except from memory) */
  else if(q.t==="lform")play(q.x.akey,q.x.full);
  else if(q.t==="lsign")play(q.x.akey,q.x.ru);
  else if(!autoOn())return;
  else if(q.t==="intro"||q.t==="pm")play(q.it.akey||q.it.key,q.it.ru);
  else if(q.t==="pmean")play(q.x.akey,q.x.ru);
  else if(q.t==="stress")play(q.x.akey,q.x.ru);
}
function answer(given){
  if(Q.answered)return;Q.answered=true;
  const q=Q.list[Q.i],right=ansOf(q);
  const ok=TYPED.includes(q.t)?(norm(given)===norm(right)||ALTS.get(norm(right))===norm(given)):given===right;
  const item=q.it||q.x,key=item.key;
  grade(key,ok);if(q.x){pstat(q.x.pid,ok);if(q.x.part)pstat(q.x.pid+":"+q.x.part,ok)}if(ok)Q.right++;Q.touched.add(key);Q.res[Q.i]=ok;save();fbRefresh("q:"+Q.qid+":"+Q.i);
  document.querySelectorAll("[data-ans]").forEach(b=>{b.disabled=true;if(b.dataset.ans===right)b.classList.add("ok");else if(b.dataset.ans===given)b.classList.add("dim")});
  const ti=$("#typein");if(ti)ti.disabled=true;
  document.querySelectorAll("[data-tile],[data-unbuild],[data-act=bcheck]").forEach(b=>b.disabled=true);
  const fullText=q.t==="form"||q.t==="fty"||q.t==="lform"?q.x.full:(q.t==="gap"||q.t==="build")?q.it.ru:right;
  const audioKey=q.x?(q.x.akey):(item.akey||item.key),audioText=fullText;
  const meaning=esc(S.lang==="ar"?item.ar:item.en);
  const links=q.x?[q.x.pid]:item.ps;
  let html="";
  if(ok){
    html=`<div class="fb"><div class="row"><span class="yes">✓ ${["form","fty","gap","build","lform"].includes(q.t)?`<span class="ru">${esc(fullText)}</span>`:T("Yes","نعم")}</span>${spk(audioKey,audioText)}</div>`;
    const f=factFor(q);if(f){Q.factShown++;Q.facts.add(f);html+=`<p class="fact">${esc(L(f))}</p>`}
    html+=`</div>`;
  }else{
    html=`<div class="fb"><div class="row" style="justify-content:space-between"><div><div class="label">${T("The answer","الإجابة")}</div><div style="font-size:22px" class="ru">${esc(fullText)}</div>${q.t==="fty"||q.t==="build"?`<div class="lead">${T("You wrote","كتبت")}: <span class="ru">${esc(given)}</span></div>`:""}<div class="lead">${meaning}</div></div>${spk(audioKey,audioText)}</div>
     ${links.length?`<div class="chips">${links.map(p=>`<a class="pill root" href="#p/${esc(p)}">${T("Open the card:","افتح⟦ي|⟧ البطاقة:")} ${esc(pname(p))}</a>`).join("")}</div>`:""}</div>`;
  }
  if(autoOn()||!ok)play(audioKey,audioText); /* hear the right answer, whole sentence where there is one */
  html+=`<button type="button" class="btn primary wide" data-act="next">${Q.i+1<Q.list.length?T("Next","التالي"):T("Finish","إنهاء")}</button>`;
  $("#fb").innerHTML=html;
  const nb=$('#fb [data-act="next"]');if(nb)setTimeout(()=>{try{nb.focus({preventScroll:false});nb.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}},30);
}

function renderEnd(){

  const again=Q.stepId&&!passed;
  if(Q.song&&!Q.smarked){Q.smarked=1;S.done[sdKey(Q.song.id,Q.song.li)]=1;save()}

   <button type="button" class="btn primary wide" data-act="step" data-id="${esc(Q.stepId)}">${T("Do this step again","أعيد⟦ي|⟧ هذه الخطوة")}</button>
   <button type="button" class="btn wide" data-act="quit">${T("Back to the path","العودة إلى المسار")}</button></div>`;

   ${fromPath&&nx?`<div class="card"><span class="label">${T(`Next: step ${nx.i+1} of ${STEPS.length}`,`التالي: الخطوة ${nx.i+1} من ${STEPS.length}`)} · ${esc(stepKind(nx))}</span><h2>${esc(stepName(nx))}</h2><p class="lead">${esc(stepSub(nx))}</p>
     <button type="button" class="btn primary wide" data-act="step" data-id="${esc(nx.id)}">${T("Next","التالي")}</button></div>`:""}
   ${sg&&snx>=0?`<div class="card"><span class="label">${T(`Next: lesson ${snx+1} of ${sg.lessons.length}`,`التالي: الدرس ${snx+1} من ${sg.lessons.length}`)}</span><h2>${esc(L(sg.lessons[snx]))}</h2>
     <button type="button" class="btn primary wide" data-act="song" data-id="${esc(sg.id)}" data-li="${snx}">${T("Next","التالي")}</button></div>`:""}
   ${sg&&snx<0?`<div class="card"><h2>${TK(sg,T("You've learned the song's words","تعلّمت كلمات الأغنية"),T("You've learned the poem's words","تعلّمت كلمات القصيدة"))}</h2><p class="lead">${TK(sg,T("Play the song again: you'll recognise much more now.","شغّل⟦ي|⟧ الأغنية مرة أخرى: ستعرف⟦ين|⟧ أكثر بكثير الآن."),T("Read the poem again: you'll recognise much more now.","⟦اقرئي|اقرأ⟧ القصيدة مرة أخرى: ستعرف⟦ين|⟧ أكثر بكثير الآن."))}</p></div>`:""}
   ${Q.title==="practice"?`<button type="button" class="btn primary wide" data-act="again">${T("Another round","جولة أخرى")}</button>`:""}
   <button type="button" class="btn wide" data-act="quit">${fromPath?T("Back to the path","العودة إلى المسار"):sg?TK(sg,T("Back to the song","العودة إلى الأغنية"),T("Back to the poem","العودة إلى القصيدة")):Q.title==="practice"?T("Back to Practice","العودة إلى التدريب"):T("Back","رجوع")}</button>
   ${fbBox("d:"+Q.qid,()=>{const qs=Q.list.filter(q=>q.t!=="intro"&&q.t!=="card"&&q.t!=="text"),wr=Q.list.map((q,i)=>Q.res[i]===false?(q.t==="form"||q.t==="fty"||q.t==="lform"?q.x.full:(q.x||q.it).ru):null).filter(Boolean);return {kind:"drill",src:Q.src,score:`${Q.right}/${qs.length} right`,wrong:wr.join(", ")}})}</div>`;

  if(a==="quit"){stopAudio();const back=Q&&Q.song?"#song/"+Q.song.id:Q&&Q.filter&&Q.filter.song?"#song/"+Q.filter.song:Q&&Q.title==="practice"?"#practice":Q&&Q.title==="step"?"#path":null;Q=null;location.hash=back||"#path";return}
  if(a==="again"){const f=Q&&Q.filter;const l=practiceQs(f,15);if(l.length){startQ(l,"practice",Q.src);Q.filter=f}return}
  if(a==="markread"){S.read[t.dataset.id]=S.read[t.dataset.id]?0:1;save();render();return}
  if(a==="stress"){S.stressAll=t.dataset.v==="1";save();render();return}
  if(a==="tts"){S.tts=t.dataset.v==="1";save();render();return}
  if(a==="auto"){S.auto=t.dataset.v==="1";save();render();return}
  if(a==="addpack"){addPack();return}
  if(a==="rmpack"){const i=+t.dataset.i;if(t.dataset.sure){PACKS.splice(i,1);savePacks();build();render()}else{t.dataset.sure="1";t.textContent=T("Tap again to remove","اضغط⟦ي|⟧ مرة أخرى للإزالة")}return}
  if(a==="backup"){backup();return}
  if(a==="fbcopy"){copyPrompt();return}
  if(a==="fbrm"){FB=FB.filter(x=>x.id!==t.dataset.id);saveFB();const op=!!$(".fb-list[open]");render();if(op){const d=$(".fb-list");if(d)d.open=true}return}
  if(a==="fbclear"){if(t.dataset.sure){FB=[];saveFB();render();const m=$("#fbmsg");if(m)m.textContent=T("All notes cleared.","حُذفت كل الملاحظات.")}else{t.dataset.sure="1";t.textContent=T(`Tap again to delete ${FB.length} notes`,`اضغط⟦ي|⟧ مرة أخرى لحذف ${FB.length} ملاحظة`)}return}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!Q||(e.target.matches&&e.target.matches("[data-fb]")))return;
  if(e.target.id==="typein"&&!Q.answered){e.preventDefault();const v=e.target.value;if(v.trim())answer(v);return}
  if(Q.answered&&!e.target.closest("a")){const nb=$('#fb [data-act="next"]');if(nb){e.preventDefault();nextQ()}}
});
document.addEventListener("change",async e=>{
  const t=e.target;if(!t.dataset||!t.files||!t.files[0])return;
  if(t.dataset.act==="songfile"){const f=t.files[0],id=t.dataset.id;t.value="";
    try{await idbSet("songfile:"+id,{blob:f,name:f.name,type:f.type});SONGF[id]=f.name}catch(err){alert(T("Couldn't save the file on this phone (storage full or private mode).","تعذّر حفظ الملف على هذا الهاتف (التخزين ممتلئ أو وضع خاص)."))}
    render();return}
  const f=t.files[0];let o=null;try{o=JSON.parse(await f.text())}catch(err){}
  if(t.dataset.act==="impaudio"){
    const m=$("#audmsg");if(!o||o.app!=="koren-audio"){m.textContent=T("That isn't a Koren recordings file.","هذا ليس ملف تسجيلات لكورين.");return}
    const sp=+o.speaker===2?2:1,lines=o.kind==="lines";
    /* the speaker's song text comes with the lines: fill songs that have no lyrics yet, keep the learner's own */
    let lyrNote="";
    if(lines&&o.lyrics&&typeof o.lyrics==="object"){const got=[],kept=[];
      Object.entries(o.lyrics).forEach(([id,txt])=>{const sg=SONGm[id];if(!sg||typeof txt!=="string"||!txt.trim())return;
        if(!LYR[id]){LYR[id]=txt;got.push(plain(sg.ru))}else if(LYR[id]!==txt)kept.push(plain(sg.ru))});
      if(got.length)saveLyr();delete o.lyrics;
      if(got.length)lyrNote+=" "+T(`Lyrics added: ${got.join(", ")}.`,`أُضيفت الكلمات: ${got.join("، ")}.`);
      if(kept.length)lyrNote+=" "+T(`You already had lyrics for ${kept.join(", ")}, so yours stay; lines written differently won't play. To use the speaker's text, delete yours on the song page and import again.`,`كانت عند⟦كِ|ك⟧ كلمات ${kept.join("، ")} فبقيت كما هي، والسطور المكتوبة بشكل مختلف لن تُسمع. لاستخدام نص المتحدّث، احذف⟦ي|⟧ نص⟦كِ|ك⟧ في صفحة الأغنية ثم استورد⟦ي|⟧ الملف مرة أخرى.`)}
    if(lines){const old=await idbGet("lines"+sp).catch(()=>null);if(old&&old.clips)o.clips=Object.assign({},old.clips,o.clips)} /* song lines add up, song by song */
    try{await idbSet(lines?"lines"+sp:sp===1?"audio":"audio2",o)}catch(err){}
    const n=addClips(o,lines?"lines":"local",sp);const msgTxt=lines?T(`Added ${n} song and poem lines (voice ${sp}). They stay on this phone.`,`أُضيف ${n} سطرًا من الأغاني والقصائد (الصوت ${sp}). تبقى على هذا الهاتف.`)+lyrNote:T(`Added ${n} recordings (voice ${sp}).`,`أُضيف ${n} تسجيلًا (الصوت ${sp}).`);render();const m3=$("#audmsg");if(m3)m3.textContent=msgTxt;return;
  }
  if(t.dataset.act==="restore"){
    const m=$("#bkmsg");if(!o||o.app!=="koren-backup"||!o.state){m.textContent=T("That isn't a Koren backup file.","هذا ليس ملف نسخة احتياطية لكورين.");return}
    S=Object.assign(S,o.state);if(Array.isArray(o.packs))PACKS=o.packs;if(o.lyrics&&typeof o.lyrics==="object"&&!Array.isArray(o.lyrics)){LYR=o.lyrics;saveLyr()}if(Array.isArray(o.feedback)){FB=o.feedback.filter(x=>x&&typeof x.id==="string"&&typeof x.text==="string");saveFB()}save();savePacks();build();render();
    const m2=$("#bkmsg");if(m2)m2.textContent=T("Progress restored.","تمت استعادة التقدم.");
  }
});
function addPack(){
  const m=$("#packmsg"),txt=($("#packtxt")||{}).value||"";let o;
  try{o=JSON.parse(txt)}catch(e){m.textContent=T("That isn't valid JSON. Copy the whole pack, from { to }.","هذا ليس JSON صالحًا. انسخ⟦ي|⟧ الحزمة كاملة من { إلى }.");return}
  if(!o||typeof o!=="object"||!o.id){m.textContent=T("A pack needs an \"id\".","الحزمة تحتاج إلى \"id\".");return}
  const i=PACKS.findIndex(p=>p.id===o.id);if(i>=0)PACKS[i]=o;else PACKS.push(o);
  if(!savePacks()){m.textContent=T("Couldn't save the pack on this phone.","تعذّر حفظ الحزمة على هذا الهاتف.");return}
  build();render();const m2=$("#packmsg");if(m2)m2.textContent=T("Pack added.","أُضيفت الحزمة.");
}
/* ================= feedback for Claude ================= */
const FBORDER={general:0,topic:1,principle:2,question:3,drill:4,reading:5,song:6};
const fbSorted=()=>FB.slice().sort((a,b)=>((FBORDER[(a.ctx||{}).kind]??9)-(FBORDER[(b.ctx||{}).kind]??9))||(a.at-b.at));
function fbWhere(x){const c=x.ctx||{};if(c.kind==="question")return `${c.src} · ${c.n} · ${c.task}`;return c.src||"Note"}
function fbCard(){
  const list=fbSorted().filter(x=>x.id!=="g"),n=FB.length;
  return `<div class="card" id="fb-card"><span class="label">${T("Feedback for Claude","ملاحظات لـ Claude")} · ${n}</span>
   <p class="lead">${T("Notes you leave under questions, results, topics, principles and readings gather here. Copy them as one message, paste it into a chat with Claude, and the app gets updated on GitHub.","الملاحظات التي تترك⟦ين|⟧ها تحت الأسئلة والنتائج والمواضيع والمبادئ والقراءات تتجمّع هنا. انسخ⟦ي|⟧ها في رسالة واحدة، والصق⟦ي|⟧ها في محادثة مع Claude، فيُحدَّث التطبيق على GitHub.")}</p>
   ${fbBox("g",()=>({kind:"general",src:"General"}),true)}
   <div class="row"><button type="button" class="btn small primary" data-act="fbcopy">${T("Copy update prompt","انسخ⟦ي|⟧ طلب التحديث")}</button>${n?`<button type="button" class="btn small" data-act="fbclear">${T("Clear all notes","احذف⟦ي|⟧ كل الملاحظات")}</button>`:""}</div>
   <textarea id="fb-out" readonly hidden aria-label="Update prompt"></textarea><p class="msg" id="fbmsg" aria-live="polite"></p>
   ${list.length?`<details class="fb-list"><summary>${T("Show notes","أظهر⟦ي|⟧ الملاحظات")} (${list.length})</summary>${list.map(x=>`<div class="fbrow"><div><small>${esc(fbWhere(x))}</small><p>${esc(x.text)}</p></div><button type="button" class="x" data-act="fbrm" data-id="${esc(x.id)}" aria-label="${T("Delete note","احذف⟦ي|⟧ الملاحظة")}">×</button></div>`).join("")}</details>`:""}</div>`;
}
function fbPrompt(){
  const notes=fbSorted(),out=[];
  out.push(`Here is feedback from using Koren ${APP_VERSION} (course v${BASE.version}) on a phone (${new Date().toISOString().slice(0,10)}). Please update the app in github.com/natmartem/Koren (index.html and course.js) to address it.

Keep progress, added lesson packs and recordings working, and don't change the app radically. Say briefly what you changed for each note (refer to them by number). If a note is unclear or you'd push back on it, say so instead of guessing.`);
  if(!notes.length){out.push("\n(No notes yet: write the feedback here.)");return out.join("\n")}
  const head={general:"General",topic:"Topics",principle:"Principles",question:"Drill questions",drill:"Whole drills",reading:"Readings",song:"Songs"};
  let lastK=null;
  notes.forEach((x,i)=>{
    const c=x.ctx||{},k=c.kind||"general";
    if(k!==lastK){out.push(`\n## ${head[k]||"Other"}`);lastK=k}
    const Ls=[`${i+1}. ${k==="question"?`${c.src}, question ${c.n}: “${c.task}”`:k==="general"?"General note":c.src||"Note"}${x.ver&&x.ver!==APP_VERSION?` (written in ${x.ver})`:""}`];
    if(k==="question"){
      if(c.prompt)Ls.push(`   Shown: ${c.prompt}`);
      if(c.opts)Ls.push(`   Options: ${c.opts}`);
      if(c.ans)Ls.push(`   Correct answer: ${c.ans} · result: ${c.result}`);
      if(c.item)Ls.push(`   Item: ${c.item}${c.key?` (${c.key})`:""}`);
      if(c.lang)Ls.push(`   Explanation language: ${c.lang}`);
    }
    if(k==="drill")Ls.push(`   Score: ${c.score}${c.wrong?` · missed: ${c.wrong}`:""}`);
    Ls.push(`   Note: ${x.text.trim().replace(/\n+/g,"\n   ")}`);
    out.push(Ls.join("\n"));
  });
  return out.join("\n");
}
async function copyPrompt(){
  const text=fbPrompt(),n=FB.length,m=$("#fbmsg");
  try{await navigator.clipboard.writeText(text);if(m)m.textContent=n?T(`Copied ${n} note${n>1?"s":""}. Paste into a chat with Claude. Clear them here once the update is in.`,`نُسخت ${n} ملاحظة. الصق⟦ي|⟧ها في محادثة مع Claude، ثم احذف⟦ي|⟧ها هنا بعد التحديث.`):T("Copied the prompt. There are no notes yet, so add your feedback in the chat.","نُسخ الطلب. لا توجد ملاحظات بعد، فاكتب⟦ي|⟧ ملاحظاتك في المحادثة.")}
  catch(e){const ta=$("#fb-out");if(ta){ta.hidden=false;ta.value=text;ta.focus();ta.select()}if(m)m.textContent=T("Couldn't copy automatically. The text is in the box: select all and copy.","تعذّر النسخ التلقائي. النص في المربع: حدّد⟦ي|⟧ه كله وانسخ⟦ي|⟧ه.")}
}
function backup(){
  const data=JSON.stringify({app:"koren-backup",v:1,made:new Date().toISOString(),state:S,packs:PACKS,feedback:FB,lyrics:LYR});
  const file=new File([data],"koren-backup-"+new Date().toISOString().slice(0,10)+".json",{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Koren backup"}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  const m=$("#bkmsg");if(m)m.textContent=T("Backup saved to your downloads.","حُفظت النسخة في التنزيلات.");
}
window.addEventListener("hashchange",()=>{LYRMSG=null;if(SEQ){stopSeq();try{speechSynthesis.cancel()}catch(e){}player.pause()}render();window.scrollTo(0,0)});
render();loadAudio();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
